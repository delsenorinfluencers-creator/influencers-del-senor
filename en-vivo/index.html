<!doctype html><html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>En Vivo | Jóvenes Influencers del Señor</title><link rel="icon" href="https://i.ibb.co/tw6GTfyV/Dise-o-sin-t-tulo-12.png"><link rel="stylesheet" href="/estilos.css"></head><body>
<header class="header"><div class="container bar"><a class="brand" href="/"><img data-logo src="" alt="Logo"><span data-site-name>Jóvenes Influencers del Señor</span></a><button class="menu" id="menuBtn">☰</button><nav class="nav" id="nav"><a href="/">Inicio</a><a href="/iglesia-al-dia/">Iglesia al Día</a><a href="/programas/">Programas</a><a href="/en-vivo/">En Vivo</a><a href="/64-datos/">64 Datos</a><a href="/diocesis/">Diócesis</a><a href="/editorial/">Editorial</a><a href="/quienes-somos/">Quiénes somos</a></nav></div></header>
<main><section class="hero"><div class="container"><p class="eyebrow">TRANSMISIÓN</p><h1><span class="dot"></span>En Vivo</h1><p class="lead">Acompaña las transmisiones de Jóvenes Influencers del Señor.</p></div></section>
<section class="section"><div class="container"><div id="estado" class="notice">Consultando la señal...</div><div id="player" class="live-box hidden" style="margin-top:24px"></div></div></section></main>
<footer><div class="container footer"><img data-logo src="" alt="Logo"><div><strong data-site-name>Jóvenes Influencers del Señor</strong><p>Comunicación al servicio de Dios.</p></div></div></footer>
<script src="/config.js"></script><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script src="/common.js"></script>
<script>
(async()=>{
 const estado=document.getElementById("estado"),player=document.getElementById("player");
 try{
  if(!window.supabase||!window.SUPABASE_URL||!window.SUPABASE_PUBLISHABLE_KEY) throw new Error("Configuración de Supabase incompleta.");
  const sb=supabase.createClient(window.SUPABASE_URL,window.SUPABASE_PUBLISHABLE_KEY);
  const r=await sb.from("live_streams").select("*").limit(20);
  if(r.error) throw r.error;
  const rows=r.data||[];
  const s=rows.find(x=>x.show_live_page===true||x.show_live===true||x.active===true)||rows[0];
  if(!s){estado.textContent="No hay una transmisión configurada.";return}
  const type=String(s.type||s.platform||"").toLowerCase(), url=s.url||s.live_url||s.m3u8_url||s.loop_url||"";
  const title=s.title||"Transmisión en vivo";
  if(!url){estado.textContent="La transmisión está activa, pero falta configurar el enlace en el panel administrativo.";return}
  estado.classList.add("hidden");player.classList.remove("hidden");
  if(url.includes(".m3u8")||type==="m3u8"){
    player.innerHTML='<h2>'+title+'</h2><video id="v" controls autoplay playsinline></video>';
    const v=document.getElementById("v");
    if(v.canPlayType("application/vnd.apple.mpegurl")) v.src=url;
    else {const sc=document.createElement("script");sc.src="https://cdn.jsdelivr.net/npm/hls.js@1.5.17";sc.onload=()=>{if(Hls.isSupported()){const h=new Hls();h.loadSource(url);h.attachMedia(v)}else{v.outerHTML='<div class="live-placeholder">Este navegador no puede reproducir HLS.</div>'}};document.body.appendChild(sc)}
  }else{
    player.innerHTML='<h2>'+title+'</h2><div class="live-placeholder"><p>🔴 Transmisión disponible</p><a class="btn" target="_blank" rel="noopener" href="'+url+'">Abrir transmisión</a></div>';
  }
 }catch(e){console.error(e);estado.textContent="No se pudo consultar la señal. Revisa la tabla live_streams y sus permisos de lectura en Supabase."}
})();
</script></body></html>
