<!doctype html><html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="description" content="Señal en vivo de Jóvenes Influencers del Señor"><title>En Vivo | Jóvenes Influencers del Señor</title><link rel="stylesheet" href="/estilos.css"></head><body>
<div id="app"></div>
<script src="/config.js"></script><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script src="https://cdn.jsdelivr.net/npm/hls.js@latest"></script><script src="/common.js"></script>
<script>
const sb=supabaseClient();
const app=document.getElementById("app");
function page(content){app.innerHTML=shell("En Vivo",content); document.dispatchEvent(new Event("jis-shell-ready"))}
function esc(s){return String(s??"").replace(/[&<>"']/g,m=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#039;"}[m]))}
function fbEmbed(url){if(!url)return "";let u=url;if(url.includes("/videos/"))return `<iframe src="https://www.facebook.com/plugins/video.php?href=${encodeURIComponent(url)}&show_text=false&width=1280" allow="autoplay; clipboard-write; encrypted-media; picture-in-picture; web-share" allowfullscreen></iframe>`;return ""}
async function load(){
 const {data,error}=await sb.from("live_streams").select("*").eq("active",true).order("priority",{ascending:true}).limit(1).maybeSingle();
 let html=`<section class="page-head"><div class="container"><p class="eyebrow">TRANSMISIÓN</p><h1>🔴 En Vivo</h1><p class="intro">Acompaña las transmisiones de Jóvenes Influencers del Señor.</p></div></section><section class="section"><div class="container">`;
 if(error){html+=`<div class="notice">No se pudo consultar la señal. Verifica la tabla <b>live_streams</b> en Supabase.</div>`}
 else if(!data){html+=`<div class="article"><h2>📺 Actualmente no estamos transmitiendo</h2><p class="intro">Cuando haya una transmisión activa, aparecerá automáticamente aquí.</p><a class="btn" href="https://www.facebook.com/jovenesinfluencersdelsenor" target="_blank" rel="noopener">Ver Facebook</a></div>`}
 else {
   html+=`<div class="live-box"><div class="live-screen" id="playerWrap"><video id="liveVideo" controls autoplay muted playsinline style="width:100%;height:100%;object-fit:contain;background:#000"></video></div></div><h2 style="margin-top:20px">${esc(data.title||"Jóvenes Influencers del Señor")}</h2>`;
   if(data.facebook_url) html+=`<p><a class="btn" href="${esc(data.facebook_url)}" target="_blank" rel="noopener">Ver en Facebook</a></p>`;
   if(data.youtube_url) html+=`<p><a class="btn" href="${esc(data.youtube_url)}" target="_blank" rel="noopener">Ver en YouTube</a></p>`;
   html+=`<div id="fb" style="margin-top:20px"></div>`;
 }
 html+=`</div></section>`;page(html);
 if(data){
   const video=document.getElementById("liveVideo");
   if(data.source_type==="m3u8" && data.m3u8_url){
     if(video.canPlayType("application/vnd.apple.mpegurl")) video.src=data.m3u8_url;
     else if(Hls.isSupported()){const hls=new Hls();hls.loadSource(data.m3u8_url);hls.attachMedia(video);}
   } else if(data.source_type==="facebook" && data.facebook_url){
     document.getElementById("playerWrap").innerHTML=fbEmbed(data.facebook_url);
   } else if(data.source_type==="youtube" && data.youtube_url){
     document.getElementById("playerWrap").innerHTML=`<iframe src="${yt(data.youtube_url)}" allow="autoplay; encrypted-media; picture-in-picture" allowfullscreen style="width:100%;height:100%;border:0"></iframe>`;
   } else if(data.source_type==="loop" && data.loop_url){
     video.src=data.loop_url; video.loop=true; video.muted=true; video.play().catch(()=>{});
   } else if(data.m3u8_url){
     if(video.canPlayType("application/vnd.apple.mpegurl")) video.src=data.m3u8_url;
     else if(Hls.isSupported()){const hls=new Hls();hls.loadSource(data.m3u8_url);hls.attachMedia(video);}
   } else if(data.loop_url){video.src=data.loop_url;video.loop=true;video.muted=true;video.play().catch(()=>{});}
 }
}
function yt(url){if(url.includes("watch?v="))return "https://www.youtube.com/embed/"+url.split("v=")[1].split("&")[0]+"?autoplay=1";if(url.includes("youtu.be/"))return "https://www.youtube.com/embed/"+url.split("youtu.be/")[1].split("?")[0]+"?autoplay=1";return url}
load();
</script></body></html>
