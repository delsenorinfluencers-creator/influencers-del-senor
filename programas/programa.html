<!doctype html><html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Programa | Jóvenes Influencers del Señor</title><meta name="description" content="Jóvenes Influencers del Señor - Comunicación al servicio de Dios."><link rel="icon" href="/favicon.svg"><link rel="stylesheet" href="/estilos.css"></head><body><header class="header"><div class="container bar"><a class="brand" href="/"><img data-logo alt="Logo"><span>Jóvenes Influencers<br><small>del Señor</small></span></a><button class="menu" id="menuBtn">☰</button><nav class="nav" id="nav"><a data-nav href="/">Inicio</a><a data-nav href="/iglesia-al-dia/">Iglesia al Día</a><a data-nav href="/programas/">Programas</a><a data-nav href="/en-vivo/">En Vivo</a><a data-nav href="/64-datos/">64 Datos</a><a data-nav href="/diocesis/">Diócesis</a><a data-nav href="/editorial/">Editorial</a><a data-nav href="/quienes-somos/">Quiénes somos</a><a data-nav href="/integrantes/">Integrantes</a><a href="/admin/login.html">🔐 Iniciar sesión</a></nav></div></header><main><section class="section"><div class="container"><div id="program" class="article"><div class="notice">Cargando programa...</div></div></div></section></main><footer><div class="container footer"><img data-logo alt="Logo"><div class="footer-center"><strong>Jóvenes Influencers del Señor</strong><p>Comunicación al servicio de Dios.</p><p>© <span data-year></span> Jóvenes Influencers del Señor</p><div class="footer-creator">Creado por <b>Gamarra TV</b></div></div></div></footer><script src="/config.js"></script><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script src="/common.js"></script><script>(async()=>{const box=document.getElementById('program'),slug=new URLSearchParams(location.search).get('slug');try{const sb=await JIS.supa();let q=sb.from('programs').select('*');q=slug&&slug.match(/^[0-9a-f-]{36}$/i)?q.eq('id',slug):q.eq('slug',slug||'');const pr=await q.maybeSingle();if(pr.error)throw pr.error;if(!pr.data)throw new Error('Programa no encontrado.');const x=pr.data;const ep=await sb.from('episodes').select('*').eq('program_id',x.id).eq('published',true).order('sort_order');if(ep.error)throw ep.error;box.innerHTML=`${x.image_url?`<img src="${JIS.esc(x.image_url)}" alt="">`:''}<span class="tag">Programa</span><h1>${JIS.esc(x.name)}</h1><p class="lead">${JIS.esc(x.description||'')}</p><h2>Episodios</h2><div class="cards">${(ep.data||[]).map(e=>`<div class="card"><h3>${JIS.esc(e.title)}</h3><p>${JIS.esc(e.description||'')}</p>${e.video_url?`<a class="btn" target="_blank" href="${JIS.esc(e.video_url)}">Ver episodio</a>`:''}</div>`).join('')||'<p>Aún no hay episodios publicados.</p>'}</div>`;document.title=x.name+' | Jóvenes Influencers del Señor'}catch(e){box.innerHTML='<div class="notice">'+JIS.esc(e.message)+'</div>'}})();</script></body></html>
