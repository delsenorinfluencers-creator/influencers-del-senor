<!doctype html><html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Iniciar sesión | Jóvenes Influencers del Señor</title><link rel="stylesheet" href="/estilos.css"><style>body{background:#f5f3e8}.login-page{min-height:100vh;display:grid;place-items:center;padding:30px}.login-box{width:min(460px,100%);background:#fff;border-radius:24px;padding:34px;box-shadow:0 15px 45px #0002}.login-logo{width:120px;height:120px;object-fit:contain;display:block;margin:0 auto 15px}.login-box h1{text-align:center;margin:8px 0 22px}.form label{display:block;font-weight:700;margin:14px 0}.form input{width:100%;box-sizing:border-box;padding:13px;border:1px solid #d7ddcf;border-radius:10px;margin-top:6px;font:inherit}.login-btn{width:100%;margin-top:8px}.msg{padding:12px;border-radius:10px;margin-bottom:15px;background:#fff0ed;color:#8b2c22}.back{display:block;text-align:center;margin-top:18px;color:#687b43}</style></head><body><main class="login-page"><section class="login-box"><img class="login-logo" src="/logo-influencers-del-senor.png" alt="Jóvenes Influencers del Señor"><p class="eyebrow" style="text-align:center">PANEL ADMINISTRATIVO</p><h1>🔐 Iniciar sesión</h1><div id="msg" class="msg" style="display:none"></div><form id="loginForm" class="form"><label>Correo electrónico<input id="email" type="email" autocomplete="username" required></label><label>Contraseña<input id="password" type="password" autocomplete="current-password" required></label><button class="btn login-btn" type="submit">Entrar al panel</button></form><a class="back" href="/">← Volver al sitio web</a></section></main><script src="/config.js"></script><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script>(function(){const msg=document.getElementById('msg');function show(t){msg.textContent=t;msg.style.display='block'}if(!window.supabase){show('No se pudo cargar el sistema de acceso. Recarga la página.');return}if(!window.SUPABASE_URL||!window.SUPABASE_PUBLISHABLE_KEY){show('Falta la configuración de Supabase en config.js.');return}const client=window.supabase.createClient(window.SUPABASE_URL,window.SUPABASE_PUBLISHABLE_KEY);document.getElementById('loginForm').addEventListener('submit',async e=>{e.preventDefault();msg.style.display='none';const email=document.getElementById('email').value.trim(),password=document.getElementById('password').value;const {error}=await client.auth.signInWithPassword({email,password});if(error){show(error.message);return}const {data:{user}}=await client.auth.getUser();const {data:admin,error:ae}=await client.from('admins').select('id').eq('id',user.id).maybeSingle();if(ae){await client.auth.signOut();show('No se pudo comprobar el administrador: '+ae.message);return}if(!admin){await client.auth.signOut();show('El usuario inició sesión, pero todavía no está autorizado como administrador. Agrega su UUID a la tabla admins en Supabase.');return}window.location.href='/admin/panel.html';});})();</script></body></html>
