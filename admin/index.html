<!doctype html>
<html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Panel administrativo | Jóvenes Influencers del Señor</title><link rel="stylesheet" href="/estilos.css">
<style>
.admin-layout{display:grid;grid-template-columns:250px 1fr;gap:22px}.admin-side{position:sticky;top:15px;align-self:start;background:#fff;border-radius:18px;padding:14px;box-shadow:0 8px 30px #0001}.admin-side button{width:100%;text-align:left;border:0;background:transparent;padding:11px;border-radius:10px;cursor:pointer;font-weight:700;color:#4d4a35}.admin-side button:hover,.admin-side button.active{background:#e5f1e7}.admin-content{min-width:0}.admin-card{background:#fff;border-radius:18px;padding:22px;box-shadow:0 8px 30px #0001;margin-bottom:18px}.admin-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:14px}.admin-grid .full{grid-column:1/-1}.form label{display:block;font-weight:700;margin-bottom:12px}.form input,.form textarea,.form select{width:100%;box-sizing:border-box;margin-top:6px;padding:11px;border:1px solid #d9dfd5;border-radius:10px;font:inherit}.form textarea{min-height:110px}.check{display:flex!important;gap:8px;align-items:center}.check input{width:auto}.admin-actions{display:flex;gap:8px;flex-wrap:wrap}.admin-table{width:100%;border-collapse:collapse}.admin-table th,.admin-table td{padding:10px;border-bottom:1px solid #eee;text-align:left;vertical-align:top}.admin-table .actions{white-space:nowrap}.mini{font-size:.88rem;color:#686858}.stat-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:14px}.stat{background:#f4f8f2;border-radius:16px;padding:18px}.stat b{display:block;font-size:1.8rem;color:#687b43}.notice{padding:12px;border-radius:10px;background:#f7f5df}.error{background:#ffe8e5!important;color:#8b2c22}.success{background:#e6f5e9!important;color:#245e35}.login-box{max-width:460px;margin:60px auto;background:#fff;padding:30px;border-radius:20px;box-shadow:0 10px 35px #0002}.admin-logo{width:100px;height:100px;object-fit:contain;display:block;margin:0 auto 15px}@media(max-width:850px){.admin-layout{grid-template-columns:1fr}.admin-side{position:static;display:grid;grid-template-columns:repeat(2,1fr)}.admin-grid,.stat-grid{grid-template-columns:1fr}.admin-table{display:block;overflow:auto;white-space:nowrap}}
</style></head><body><div id="app"></div>
<script src="/config.js"></script><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script>
const sb=supabaseClient(); const app=document.getElementById('app');
const C={logo:'/logo-influencers-del-senor.png'};
const esc=s=>String(s??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#039;'}[m]));
let current={key:'dashboard',id:null};

const sections={
 dashboard:{label:'📊 Dashboard'},
 news:{label:'📰 Iglesia al Día'}, programs:{label:'🎬 Programas'}, episodes:{label:'🎞️ Episodios'},
 live:{label:'🔴 En Vivo'}, history:{label:'✝️ 64 Datos'}, diocese:{label:'⛪ Diócesis'},
 parishes:{label:'🏛️ Parroquias'}, clergy:{label:'⛪ Sacerdotes'}, advocations:{label:'🙏 Advocaciones'},
 members:{label:'👥 Quiénes somos'}, editorial:{label:'✍️ Editorial'}, settings:{label:'⚙️ Configuración'}
};
const configs={
 news:{table:'news',title:'Iglesia al Día',fields:[
 ['title','Título','input','required'],['category','Tipo de noticia','select:diocesanas|nacionales|internacionales'],['excerpt','Resumen','textarea'],['content','Contenido','textarea full'],['image_url','Imagen (URL)','input'],['youtube_url','Video YouTube','input'],['facebook_url','Video Facebook','input'],['published','Publicada','check']]},
 programs:{table:'programs',title:'Programas',fields:[
 ['name','Nombre','input','required'],['slug','Slug','input','required'],['description','Descripción','textarea'],['logo_url','Logo / imagen (URL)','input'],['sort_order','Orden','number'],['published','Visible','check']]},
 episodes:{table:'episodes',title:'Episodios / videos',fields:[
 ['program_id','Programa','programs'],['title','Título','input','required'],['description','Descripción','textarea'],['episode_number','Número de episodio','number'],['image_url','Imagen (URL)','input'],['youtube_url','YouTube','input'],['facebook_url','Facebook','input'],['video_url','Video directo MP4','input'],['sort_order','Orden','number'],['published','Publicado','check']]},
 history:{table:'historical_64',title:'64 Datos Históricos',fields:[
 ['number','Número 1–64','number','required'],['title','Título','input','required'],['content','Texto histórico','textarea'],['image_url','Imagen (URL)','input'],['youtube_url','YouTube','input'],['facebook_url','Facebook','input'],['video_url','Video directo','input'],['published','Publicado','check'],['active_in_october','Activo en octubre','check']]},
 editorial:{table:'editorials',title:'Editorial',fields:[
 ['title','Título','input','required'],['excerpt','Resumen','textarea'],['content','Contenido','textarea full'],['image_url','Imagen (URL)','input'],['author','Autor','input'],['published','Publicado','check']]},
 members:{table:'members',title:'Integrantes',fields:[
 ['name','Nombre','input','required'],['role','Cargo / función','input'],['photo_url','Foto (URL)','input'],['bio','Biografía','textarea'],['social_url','Red social','input'],['sort_order','Orden','number'],['published','Visible','check']]},
 parishes:{table:'parishes',title:'Parroquias',fields:[
 ['name','Parroquia','input','required'],['municipality','Municipio','input'],['address','Dirección','input'],['image_url','Imagen','input'],['description','Descripción','textarea'],['website_url','Web','input'],['sort_order','Orden','number'],['published','Visible','check']]},
 clergy:{table:'clergy',title:'Sacerdotes / información pastoral',fields:[
 ['name','Nombre','input','required'],['role','Cargo','input'],['parish','Parroquia','input'],['photo_url','Foto','input'],['bio','Biografía','textarea'],['sort_order','Orden','number'],['published','Visible','check']]},
 advocations:{table:'marian_advocations',title:'Advocaciones marianas',fields:[
 ['name','Nombre','input','required'],['description','Descripción','textarea'],['image_url','Imagen','input'],['sort_order','Orden','number'],['published','Visible','check']]}
};

function login(msg=''){app.innerHTML=`<main class="section"><div class="container"><div class="login-box"><img src="${C.logo}" class="admin-logo"><p class="eyebrow" style="text-align:center">JÓVENES INFLUENCERS DEL SEÑOR</p><h1 style="text-align:center">🔐 Iniciar sesión</h1>${msg?`<div class="notice error">${esc(msg)}</div>`:''}<form id="loginForm" class="form"><label>Correo<input id="email" type="email" required></label><label>Contraseña<input id="password" type="password" required></label><button class="btn" type="submit">Entrar al panel</button></form></div></div></main>`;loginForm.onsubmit=async e=>{e.preventDefault();const {error}=await sb.auth.signInWithPassword({email:email.value,password:password.value});if(error)return login(error.message);await boot();};}
async function isAdmin(){const {data:{user}}=await sb.auth.getUser();if(!user)return null;const {data}=await sb.from('admins').select('id').eq('id',user.id).maybeSingle();return data?user:null}
async function boot(){if(!await isAdmin())return login('Usuario no autorizado. Crea el usuario en Authentication y agrega su UUID a la tabla admins.');renderShell();openSection('dashboard')}
function renderShell(){app.innerHTML=`<main class="section"><div class="container"><div class="admin-actions" style="justify-content:space-between;align-items:center"><div><p class="eyebrow">PANEL ADMINISTRATIVO</p><h1>Jóvenes Influencers del Señor</h1></div><button class="btn" id="logout">Cerrar sesión</button></div><div class="admin-layout" style="margin-top:24px"><aside class="admin-side">${Object.entries(sections).map(([k,v])=>`<button data-key="${k}">${v.label}</button>`).join('')}</aside><section class="admin-content" id="content"></section></div></div></main>`;document.querySelectorAll('.admin-side button').forEach(b=>b.onclick=()=>openSection(b.dataset.key));logout.onclick=async()=>{await sb.auth.signOut();login()}}
function setActive(k){document.querySelectorAll('.admin-side button').forEach(b=>b.classList.toggle('active',b.dataset.key===k))}
async function openSection(k){current={key:k,id:null};setActive(k);if(k==='dashboard')return dashboard();if(k==='live')return live();if(k==='diocese')return diocese();if(k==='settings')return settings();if(k==='episodes')return episodes();return crud(k)}
async function count(t){const {count,error}=await sb.from(t).select('*',{count:'exact',head:true});return error?0:count||0}
async function dashboard(){content.innerHTML=`<div class="admin-card"><p class="eyebrow">RESUMEN</p><h2>Contenido publicado</h2><div class="stat-grid"><div class="stat">Noticias<b id="cnews">…</b></div><div class="stat">Programas<b id="cprog">…</b></div><div class="stat">Videos<b id="cepi">…</b></div><div class="stat">64 Datos<b id="chist">…</b></div></div></div><div class="admin-card"><h2>Accesos rápidos</h2><div class="admin-actions"><button class="btn" onclick="openSection('news')">+ Noticia</button><button class="btn" onclick="openSection('episodes')">+ Video</button><button class="btn" onclick="openSection('live')">🔴 En Vivo</button><button class="btn" onclick="openSection('editorial')">+ Editorial</button></div></div>`;[['cnews','news'],['cprog','programs'],['cepi','episodes'],['chist','historical_64']].forEach(async x=>document.getElementById(x[0]).textContent=await count(x[1]))}
function inputField(f,obj){let [key,label,type,flag]=f;let v=obj?.[key]??'';if(type==='check')return `<label class="check"><input type="checkbox" name="${key}" ${v===false?'':'checked'}> ${label}</label>`;if(type==='select:diocesanas|nacionales|internacionales'){return `<label>${label}<select name="${key}">${['diocesanas','nacionales','internacionales'].map(x=>`<option ${v===x?'selected':''}>${x}</option>`).join('')}</select></label>`}if(type==='programs'){return `<label>${label}<select name="${key}" id="${key}"><option value="">Seleccionar…</option></select></label>`}let tag=type==='textarea'?'textarea':type==='number'?'input':'input';return `<label>${label}${tag==='textarea'?`<textarea name="${key}" ${flag==='full'?'class="full"':''}>${esc(v)}</textarea>`:`<input name="${key}" type="${tag==='input'&&type==='number'?'number':'text'}" value="${esc(v)}" ${flag==='required'?'required':''}>`}</label>`}
async function crud(k){let c=configs[k],data=await listData(c.table);content.innerHTML=`<div class="admin-card"><div class="admin-actions" style="justify-content:space-between"><div><p class="eyebrow">ADMINISTRAR</p><h2>${c.title}</h2></div><button class="btn" onclick="newItem('${k}')">+ Crear</button></div><div id="formArea"></div></div><div class="admin-card"><h3>Registros</h3><div id="rows">${table(c,data)}</div></div>`}
async function listData(t){let q=sb.from(t).select('*').order('created_at',{ascending:false});const {data,error}=await q.limit(100);return error?{error,data:[]}: {error:null,data:data||[]}}
function table(c,res){if(res.error)return `<div class="notice error">${esc(res.error.message)}</div>`;if(!res.data.length)return '<p class="mini">No hay registros.</p>';return `<table class="admin-table"><thead><tr><th>Contenido</th><th>Estado</th><th>Acciones</th></tr></thead><tbody>${res.data.map(x=>`<tr><td><b>${esc(x.title||x.name||('Dato '+x.number))}</b><div class="mini">${esc(x.category||'')}</div></td><td>${x.published===false?'Oculto':'Publicado'}</td><td class="actions"><button onclick='editItem("${c.table}","${x.id}")'>Editar</button> <button onclick='deleteItem("${c.table}","${x.id}")'>Eliminar</button></td></tr>`).join('')}</tbody></table>`}
async function newItem(k){const c=configs[k];current.id=null;document.getElementById('formArea').innerHTML=`<form id="entityForm" class="form admin-grid">${c.fields.map(f=>inputField(f,{})).join('')}<div class="full admin-actions"><button class="btn" type="submit">Guardar</button><button type="button" onclick="document.getElementById('formArea').innerHTML=''">Cancelar</button><span id="formMsg"></span></div></form>`;if(c.fields.some(f=>f[0]==='program_id'))await fillPrograms();entityForm.onsubmit=e=>saveEntity(e,k)}
async function fillPrograms(){const {data}=await sb.from('programs').select('id,name').order('sort_order');const s=document.getElementById('program_id');s.innerHTML='<option value="">Seleccionar…</option>'+data.map(x=>`<option value="${x.id}">${esc(x.name)}</option>`).join('')}
async function editItem(t,id){let k=Object.keys(configs).find(x=>configs[x].table===t),c=configs[k];const {data,error}=await sb.from(t).select('*').eq('id',id).single();if(error)return alert(error.message);current.id=id;document.getElementById('formArea').innerHTML=`<form id="entityForm" class="form admin-grid">${c.fields.map(f=>inputField(f,data)).join('')}<div class="full admin-actions"><button class="btn">Guardar cambios</button><button type="button" onclick="openSection('${k}')">Cancelar</button></div></form>`;if(c.fields.some(f=>f[0]==='program_id')){await fillPrograms();program_id.value=data.program_id||''}entityForm.onsubmit=e=>saveEntity(e,k)}
async function saveEntity(e,k){e.preventDefault();const c=configs[k],fd=new FormData(e.target),o={};c.fields.forEach(f=>{let key=f[0];if(f[2]==='check')o[key]=fd.get(key)==='on';else if(f[2]==='number')o[key]=fd.get(key)?Number(fd.get(key)):0;else o[key]=fd.get(key)||null});let q=current.id?sb.from(c.table).update(o).eq('id',current.id):sb.from(c.table).insert(o);const {error}=await q;if(error)return document.getElementById('formMsg').textContent=error.message;openSection(k)}
async function deleteItem(t,id){if(!confirm('¿Eliminar este contenido?'))return;const {error}=await sb.from(t).delete().eq('id',id);if(error)alert(error.message);else openSection(current.key)}
async function live(){const {data}=await sb.from('live_streams').select('*').order('priority').limit(1);let x=data?.[0]||{};content.innerHTML=`<div class="admin-card"><p class="eyebrow">SEÑAL</p><h2>🔴 En Vivo</h2><p class="mini">Puedes administrar M3U8/HLS, videos en loop, Facebook Live y YouTube Live. La fuente activa aparece en Inicio y /en-vivo/.</p><form id="liveForm" class="form admin-grid"><label>Tipo de fuente<select name="source_type"><option value="m3u8">📡 M3U8 / HLS</option><option value="loop">🎬 Video Loop</option><option value="facebook">🔵 Facebook Live</option><option value="youtube">▶️ YouTube Live</option></select></label><label>Título<input name="title" value="${esc(x.title||'Jóvenes Influencers del Señor')}"></label><label>M3U8<input name="m3u8_url" value="${esc(x.m3u8_url||'')}" placeholder="https://.../stream.m3u8"></label><label>Video Loop MP4<input name="loop_url" value="${esc(x.loop_url||'')}" placeholder="https://.../video.mp4"></label><label>Facebook Live<input name="facebook_url" value="${esc(x.facebook_url||'')}" placeholder="https://www.facebook.com/.../videos/..."></label><label>YouTube Live<input name="youtube_url" value="${esc(x.youtube_url||'')}" placeholder="https://www.youtube.com/watch?v=..."></label><label>Imagen<input name="image_url" value="${esc(x.image_url||'')}"></label><label>Prioridad<input name="priority" type="number" value="${x.priority||1}"></label><label class="check"><input type="checkbox" name="active" ${x.active?'checked':''}> Activar transmisión</label><label class="check"><input type="checkbox" name="show_home" ${x.show_home===false?'':'checked'}> Mostrar en Inicio</label><label class="check"><input type="checkbox" name="show_live" ${x.show_live===false?'':'checked'}> Mostrar en /en-vivo/</label><div class="full admin-actions"><button class="btn">Guardar señal</button><button type="button" onclick="disableLive()">⏹ Desactivar</button></div></form></div><div class="admin-card"><h3>Cómo usarlo</h3><p><b>M3U8:</b> pega una URL HLS pública HTTPS. <b>Loop:</b> usa un enlace directo a un MP4. <b>Facebook/YouTube:</b> pega el enlace del Live.</p></div>`;liveForm.source_type.value=x.source_type||'m3u8';liveForm.onsubmit=async e=>{e.preventDefault();let fd=new FormData(e.target),o=Object.fromEntries(fd.entries());o.active=fd.get('active')==='on';o.show_home=fd.get('show_home')==='on';o.show_live=fd.get('show_live')==='on';o.priority=Number(o.priority||1);if(x.id){await sb.from('live_streams').update(o).eq('id',x.id)}else{await sb.from('live_streams').insert(o)}alert('Señal guardada.');live()}}
async function disableLive(){const {error}=await sb.from('live_streams').update({active:false}).neq('id','00000000-0000-0000-0000-000000000000');if(error)alert(error.message);else live()}
async function episodes(){return crud('episodes')}
async function diocese(){content.innerHTML=`<div class="admin-card"><p class="eyebrow">DIÓCESIS</p><h2>Historia e información de la Diócesis de Ocaña</h2><div id="dioform"></div></div>`;let {data}=await sb.from('diocese_info').select('*').eq('id',1).maybeSingle();dioform.innerHTML=`<form id="df" class="form"><label>Descripción<textarea name="description">${esc(data?.description||'')}</textarea></label><label>Historia<textarea name="history">${esc(data?.history||'')}</textarea></label><label>Obispo / información pastoral<input name="bishop" value="${esc(data?.bishop||'')}"></label><button class="btn">Guardar</button></form>`;df.onsubmit=async e=>{e.preventDefault();let o=Object.fromEntries(new FormData(e.target).entries());o.id=1;const {error}=await sb.from('diocese_info').upsert(o);alert(error?error.message:'Guardado correctamente.');}}
async function settings(){content.innerHTML=`<div class="admin-card"><p class="eyebrow">SITIO</p><h2>⚙️ Configuración</h2><div id="sf"></div></div><div class="admin-card"><h3>📤 Subir imagen o logo</h3><input type="file" id="mediaFile" accept="image/*"><button class="btn" id="uploadBtn">Subir</button><p id="uploadMsg" class="mini"></p></div>`;let {data}=await sb.from('site_settings').select('*').eq('id',1).maybeSingle();sf.innerHTML=`<form id="setForm" class="form admin-grid">${[['site_name','Nombre del sitio'],['logo_url','Logo URL'],['facebook_url','Facebook'],['youtube_url','YouTube'],['whatsapp','WhatsApp'],['email','Correo'],['phone','Teléfono'],['address','Dirección'],['organization_name','Organización'],['organization_url','URL oficial'],['seo_title','Título SEO'],['seo_description','Descripción SEO']].map(([k,l])=>`<label>${l}<input name="${k}" value="${esc(data?.[k]||'')}"></label>`).join('')}<label class="full">Descripción<textarea name="description">${esc(data?.description||'')}</textarea></label><button class="btn">Guardar configuración</button></form>`;setForm.onsubmit=async e=>{e.preventDefault();let o=Object.fromEntries(new FormData(e.target).entries());o.id=1;const {error}=await sb.from('site_settings').upsert(o);alert(error?error.message:'Configuración guardada.');};uploadBtn.onclick=async()=>{const f=mediaFile.files[0];if(!f)return;const path=`${Date.now()}-${f.name.replace(/[^a-zA-Z0-9._-]/g,'-')}`;const {error}=await sb.storage.from('media').upload(path,f);if(error)return uploadMsg.textContent=error.message;const {data}=sb.storage.from('media').getPublicUrl(path);uploadMsg.innerHTML=`URL pública: <input value="${esc(data.publicUrl)}" readonly>`}}
(async()=>{const {data:{session}}=await sb.auth.getSession();session?boot():login()})();
</script></body></html>
