<!doctype html><html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Panel | Jóvenes Influencers del Señor</title><link rel="icon" href="https://i.ibb.co/tw6GTfyV/Dise-o-sin-t-tulo-12.png"><link rel="stylesheet" href="/estilos.css"><style>
.admin{min-height:100vh;display:grid;grid-template-columns:250px 1fr}.side{background:#21180f;color:#fff;padding:24px;position:sticky;top:0;height:100vh}.side img{width:90px;height:90px;object-fit:contain;display:block;margin:auto}.side h2{text-align:center;font-size:18px}.side button{width:100%;padding:12px;border:0;background:transparent;color:#fff;text-align:left;border-radius:12px;margin:3px 0;cursor:pointer;font-weight:700}.side button:hover{background:rgba(255,255,255,.1)}.main{padding:30px}.panel{background:#fff;border:1px solid var(--borde);border-radius:22px;padding:24px;box-shadow:var(--sombra)}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(180px,1fr));gap:16px}.stat{background:#fff;border:1px solid var(--borde);border-radius:18px;padding:20px}.stat b{font-size:34px}@media(max-width:800px){.admin{display:block}.side{position:static;height:auto}.main{padding:18px}}
</style></head><body><div id="app" class="panel" style="margin:30px">Cargando panel...</div>
<script src="/config.js"></script><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script>
(async()=>{
 const app=document.getElementById("app");
 const esc=s=>String(s??"").replace(/[&<>"']/g,m=>({"&":"&amp;","<":"&lt;",">":"&gt;","\"":"&quot;","'":"&#039;"}[m]));
 if(!window.supabase||!window.SUPABASE_URL||!window.SUPABASE_PUBLISHABLE_KEY){app.innerHTML="<h2>Configuración incompleta</h2><p>Revisa config.js.</p>";return}
 const sb=supabase.createClient(window.SUPABASE_URL,window.SUPABASE_PUBLISHABLE_KEY);
 const {data:{session}}=await sb.auth.getSession();
 if(!session){location.href="/admin/login.html";return}
 const {data:admin,error}=await sb.from("admins").select("id").eq("id",session.user.id).maybeSingle();
 if(error){app.innerHTML="<h2>Error de permisos</h2><p>"+esc(error.message)+"</p>";return}
 if(!admin){app.innerHTML="<h2>Usuario no autorizado</h2><p>"+esc(session.user.email)+"</p><button onclick='out()'>Cerrar sesión</button>";window.out=()=>sb.auth.signOut().then(()=>location.href="/admin/login.html");return}
 const counts=await Promise.all(["news","programs","episodes","historical_64","live_streams"].map(async t=>{const r=await sb.from(t).select("*",{count:"exact",head:true});return [t,r.error? "—":(r.count??0)]}));
 app.innerHTML='<div class="admin"><aside class="side"><img src="'+esc(window.JIS_CONFIG.logo)+'"><h2>Panel administrativo</h2><button>📊 Dashboard</button><button>📰 Noticias</button><button>🎬 Los 11 programas</button><button>🔴 En Vivo</button><button>✝️ 64 Datos</button><button>⛪ Diócesis</button><button>👥 Integrantes</button><button>✍️ Editorial</button><button>🖼️ Imágenes</button><button>👤 Usuarios</button><button>⚙️ Configuración</button><hr><button id="logout">🚪 Cerrar sesión</button></aside><main class="main"><div class="panel"><p class="eyebrow">ADMINISTRACIÓN</p><h1>Dashboard</h1><p>Sesión: <b>'+esc(session.user.email)+'</b></p></div><div class="grid" style="margin-top:18px">'+counts.map(x=>'<div class="stat"><span>'+esc(x[0])+'</span><br><b>'+x[1]+'</b></div>').join("")+'</div><div class="panel" style="margin-top:18px"><h2>Control central</h2><p>Esta base visual queda lista para conectar cada módulo con Supabase. El reproductor de En Vivo lee la configuración publicada desde <code>live_streams</code>.</p></div></main></div>';
 document.getElementById("logout").onclick=async()=>{await sb.auth.signOut();location.href="/admin/login.html"};
})();
</script></body></html>
