<script type="application/ld+json">{"@context":"https://schema.org","@type":"WebPage","name":"Jóvenes Influencers del Señor","url":"https://influencersdelsenor.com/admin/","description":"Contenido católico de Jóvenes Influencers del Señor.","isPartOf":{"@type":"WebSite","name":"Jóvenes Influencers del Señor","url":"https://influencersdelsenor.com"}}</script>
</head><body><div id="app"></div>
<script src="/config.js"></script><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script src="/common.js"></script>
<script>
const sb=supabaseClient();
const app=document.getElementById("app");
function loginView(msg=""){app.innerHTML=`<main class="section"><div class="container"><div class="admin-login"><img class="admin-logo" src="${C.logo}" alt="Logo"><p class="eyebrow" style="text-align:center">PANEL ADMINISTRATIVO</p><h1 style="text-align:center">Ingresar</h1>${msg?`<div class="admin-msg error">${msg}</div>`:""}<form id="loginForm" class="form"><label>Correo electrónico<input id="email" type="email" required autocomplete="username"></label><label>Contraseña<input id="password" type="password" required autocomplete="current-password"></label><button class="btn" type="submit">Entrar al panel</button></form><p style="font-size:13px;color:var(--gris);margin-top:15px">El usuario debe existir en Supabase Authentication y estar autorizado en la tabla <b>admins</b>.</p></div></div></main>`;document.getElementById("loginForm").onsubmit=async e=>{e.preventDefault();const {error}=await sb.auth.signInWithPassword({email:email.value,password:password.value});if(error)return loginView(error.message);await renderPanel()}}
async function isAdmin(){const {data:{user}}=await sb.auth.getUser();if(!user)return null;const {data,error}=await sb.from("admins").select("id").eq("id",user.id).maybeSingle();if(error||!data)return "notadmin";return user}
async function renderPanel(){const user=await isAdmin();if(!user){return loginView(user==="notadmin"?"Tu usuario inició sesión, pero todavía no está autorizado como administrador en Supabase.":"Debes iniciar sesión.")}app.innerHTML=`<main class="section"><div class="container"><div class="admin-toolbar"><div><p class="eyebrow">ADMINISTRACIÓN</p><h1>Panel de contenidos</h1><p class="intro">Publica noticias, videos, 64 datos y editoriales.</p></div><button id="logout" class="btn danger">Cerrar sesión</button></div><div class="admin-shell" style="margin-top:25px"><aside class="admin-side"><a href="#" data-tab="news">📰 Noticias</a><a href="#" data-tab="history">✝ 64 Datos</a><a href="#" data-tab="editorial">✍️ Editorial</a><a href="#" data-tab="live">🔴 En Vivo</a></aside><section class="admin-main" id="panelContent"></section></div></div></main>`;document.getElementById("logout").onclick=async()=>{await sb.auth.signOut();loginView()};document.querySelectorAll("[data-tab]").forEach(a=>a.onclick=e=>{e.preventDefault();loadTab(a.dataset.tab)});loadTab("news")}
async function loadTab(tab){const box=document.getElementById("panelContent");if(tab==="news"){box.innerHTML=crudForm("news","Nueva noticia",`<input name="title" placeholder="Título" required><textarea name="excerpt" placeholder="Resumen"></textarea><textarea name="content" placeholder="Contenido"></textarea><input name="image_url" placeholder="URL de imagen"><input name="youtube_url" placeholder="URL de YouTube"><input name="facebook_url" placeholder="URL de Facebook">`);await listNews(box)}else if(tab==="history"){box.innerHTML=crudForm("history","Nuevo dato histórico",`<input name="number" type="number" min="1" max="64" placeholder="Número 1-64" required><input name="title" placeholder="Título" required><textarea name="content" placeholder="Contenido"></textarea><input name="youtube_url" placeholder="URL de YouTube"><input name="facebook_url" placeholder="URL de Facebook">`);await listHistory(box)}else if(tab==="editorial"){box.innerHTML=crudForm("editorial","Nueva editorial",`<input name="title" placeholder="Título" required><textarea name="excerpt" placeholder="Resumen"></textarea><textarea name="content" placeholder="Contenido"></textarea><input name="image_url" placeholder="URL de imagen">`);await listEditorial(box)}else{await livePanel(box)}}
async function livePanel(box){const {data}=await sb.from("live_streams").select("*").order("updated_at",{ascending:false}).limit(1).maybeSingle();const x=data||{};box.innerHTML=`<div class="article"><p class="eyebrow">TRANSMISIÓN DE FACEBOOK</p><h2>Control de señal en vivo</h2><p class="intro">Cuando estés transmitiendo, pega aquí la URL del video Live de Facebook y activa la señal. La transmisión aparecerá tanto en <b>/en-vivo/</b> como en la página de inicio.</p><form id="liveForm" class="form"><input name="title" value="${x.title||'Jóvenes Influencers del Señor'}" placeholder="Título de la transmisión" required><textarea name="description" placeholder="Descripción">${x.description||''}</textarea><input name="facebook_url" value="${x.facebook_url||''}" placeholder="URL del Facebook Live" required><label style="display:flex;gap:10px;align-items:center"><input name="active" type="checkbox" ${x.active?'checked':''} style="width:auto"> Mostrar como EN VIVO</label><button class="btn live" type="submit">Guardar estado de transmisión</button><div id="liveMsg"></div></form></div>`;document.getElementById("liveForm").onsubmit=async e=>{e.preventDefault();const p=Object.fromEntries(new FormData(e.target).entries());p.active=e.target.active.checked;p.updated_at=new Date().toISOString();let err;if(x.id){({error:err}=await sb.from("live_streams").update(p).eq("id",x.id))}else{({error:err}=await sb.from("live_streams").insert(p))}document.getElementById("liveMsg").innerHTML=err?`<div class="admin-msg error">${err.message}</div>`:`<div class="admin-msg">${p.active?'🔴 Transmisión activada. Ya aparece en Inicio y En Vivo.':'Transmisión desactivada.'}</div>`;await livePanel(box)}}
function crudForm(kind,title,fields){return `<div class="article"><h2>${title}</h2><form id="contentForm" class="form">${fields}<button class="btn" type="submit">Publicar</button><div id="formMsg"></div></form></div><div class="article"><h2>Publicados</h2><div id="items">Cargando...</div></div>`}
async function save(table,payload){payload.published=true;const {error}=await sb.from(table).insert(payload);return error}
function formPayload(form){return Object.fromEntries(new FormData(form).entries())}
async function listNews(box){document.getElementById("contentForm").onsubmit=async e=>{e.preventDefault();const err=await save("news",formPayload(e.target));document.getElementById("formMsg").innerHTML=err?`<div class="admin-msg error">${err.message}</div>`:`<div class="admin-msg">Noticia publicada correctamente.</div>`;if(!err){e.target.reset();listNews(box)}};const {data,error}=await sb.from("news").select("*").order("published_at",{ascending:false});document.getElementById("items").innerHTML=error?error.message:(data?.length?`<table class="admin-table"><tr><th>Título</th><th>Fecha</th></tr>${data.map(x=>`<tr><td>${x.title}</td><td>${new Date(x.published_at).toLocaleString("es-CO")}</td></tr>`).join("")}</table>`:"No hay noticias todavía.")}
async function listHistory(box){document.getElementById("contentForm").onsubmit=async e=>{e.preventDefault();const p=formPayload(e.target);p.number=Number(p.number);const err=await save("historical_64",p);document.getElementById("formMsg").innerHTML=err?`<div class="admin-msg error">${err.message}</div>`:`<div class="admin-msg">Dato publicado correctamente.</div>`;if(!err){e.target.reset();listHistory(box)}};const {data,error}=await sb.from("historical_64").select("*").order("number");document.getElementById("items").innerHTML=error?error.message:(data?.length?`<table class="admin-table"><tr><th>#</th><th>Título</th></tr>${data.map(x=>`<tr><td>${x.number}</td><td>${x.title}</td></tr>`).join("")}</table>`:"No hay datos históricos todavía.")}
async function listEditorial(box){document.getElementById("contentForm").onsubmit=async e=>{e.preventDefault();const err=await save("editorials",formPayload(e.target));document.getElementById("formMsg").innerHTML=err?`<div class="admin-msg error">${err.message}</div>`:`<div class="admin-msg">Editorial publicada correctamente.</div>`;if(!err){e.target.reset();listEditorial(box)}};const {data,error}=await sb.from("editorials").select("*").order("published_at",{ascending:false});document.getElementById("items").innerHTML=error?error.message:(data?.length?`<table class="admin-table"><tr><th>Título</th><th>Fecha</th></tr>${data.map(x=>`<tr><td>${x.title}</td><td>${new Date(x.published_at).toLocaleString("es-CO")}</td></tr>`).join("")}</table>`:"No hay editoriales todavía.")}
(async()=>{const {data:{session}}=await sb.auth.getSession();session?renderPanel():loginView()})();
</script></body></html>
