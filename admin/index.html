<!doctype html><html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><link rel="icon" href="https://i.ibb.co/tw6GTfyV/Dise-o-sin-t-tulo-12.png"><link rel="stylesheet" href="/estilos.css"><title>Iniciar sesión | Panel administrativo</title></head><body><div class="login-box"><div style="text-align:center"><img src="https://i.ibb.co/tw6GTfyV/Dise-o-sin-t-tulo-12.png" style="width:120px;height:120px;object-fit:contain" alt="Logo"><h1>Panel administrativo</h1><p class="muted">Inicia sesión para administrar el sitio.</p></div><form id="loginForm"><label>Correo<input type="email" id="email" required autocomplete="email"></label><label>Contraseña<input type="password" id="password" required autocomplete="current-password"></label><button class="btn" type="submit">Iniciar sesión</button><div id="msg"></div></form></div><script src="/config.js"></script><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script>const c=supabase.createClient(SUPABASE_URL,SUPABASE_PUBLISHABLE_KEY);document.getElementById('loginForm').onsubmit=async e=>{e.preventDefault();const msg=document.getElementById('msg');msg.textContent='Entrando...';const {error}=await c.auth.signInWithPassword({email:email.value,password:password.value});if(error){msg.className='error';msg.textContent=error.message;return}location.href='/admin/panel.html'}</script></body></html>
