<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Panel administrativo | Jóvenes Influencers del Señor</title>
<link rel="icon" href="https://i.ibb.co/tw6GTfyV/Dise-o-sin-t-tulo-12.png">
<style>
:root{--brown:#21170f;--brown2:#40362e;--cream:#f7f6f2;--line:#eadfce;--green:#5d7d42;--text:#24190f}
*{box-sizing:border-box}html,body{margin:0;min-height:100%;font-family:Arial,Helvetica,sans-serif;background:var(--cream);color:var(--text)}
body{overflow-x:hidden}button,input,select,textarea{font:inherit}.app{min-height:100vh}
.sidebar{position:fixed;z-index:1000;inset:0 auto 0 0;width:286px;background:var(--brown);color:#fff;overflow-y:auto;overscroll-behavior:contain;padding:18px 14px;box-shadow:4px 0 18px rgba(0,0,0,.08)}
.brand{text-align:center;padding:4px 8px 16px}.brand img{width:86px;height:86px;object-fit:contain}.brand h2{font-size:18px;margin:7px 0 0}
.menu{display:flex;flex-direction:column;gap:3px}.menu button{width:100%;border:0;background:transparent;color:#fff;text-align:left;padding:12px 13px;border-radius:11px;cursor:pointer;font-weight:700;line-height:1.2}.menu button:hover,.menu button.active{background:var(--brown2)}.menu hr{width:100%;border:0;border-top:1px solid #5a4d43;margin:15px 0}
.main{margin-left:286px;min-height:100vh;padding:24px;transition:margin .2s}.topbar{position:sticky;top:0;z-index:20;background:rgba(247,246,242,.94);backdrop-filter:blur(10px);padding-bottom:14px;margin-bottom:12px;display:flex;align-items:center;justify-content:space-between;gap:12px}.topbar h1{margin:0;font-size:34px}.session{font-size:14px}.mobilebar{display:none}
.card{background:#fff;border:1px solid var(--line);border-radius:22px;box-shadow:0 8px 28px rgba(0,0,0,.05);padding:22px;margin-bottom:18px}.card h2{margin:0 0 12px}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:16px}.number{font-size:34px;font-weight:800;margin-top:7px}.form-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:14px}.field{min-width:0}.field.full{grid-column:1/-1}label{display:block;font-weight:700;margin:0 0 6px}input,select,textarea{width:100%;padding:11px 12px;border:1px solid #d8ccb9;border-radius:10px;background:#fff;color:var(--text)}textarea{min-height:100px;resize:vertical}.btn{border:0;border-radius:10px;padding:11px 15px;cursor:pointer;font-weight:700}.primary{background:var(--green);color:#fff}.secondary{background:#eee5d8;color:var(--text)}.danger{background:#9b3d3d;color:#fff}.muted{color:#74695f}.error,.ok,.warn{padding:13px 14px;border-radius:12px;margin:10px 0}.error{background:#fff0df;color:#8b4d00;border:1px solid #efd39c}.ok{background:#e8f6e5;color:#28621e;border:1px solid #b9dfb0}.warn{background:#fff8d9;color:#6e5a00;border:1px solid #ead78b}.loading{text-align:center;padding:35px}.toolbar{display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin-bottom:14px}.banner-list{display:grid;gap:10px}.banner-row{display:flex;align-items:center;gap:12px;padding:12px;border:1px solid var(--line);border-radius:12px}.banner-row img{width:190px;height:70px;object-fit:cover;border-radius:8px;background:#eee}.grow{flex:1;min-width:0}.small{font-size:13px}.url{word-break:break-all}.overlay{display:none}
@media(max-width:900px){.sidebar{width:250px}.main{margin-left:250px;padding:18px}.topbar h1{font-size:28px}}
@media(max-width:700px){
 .sidebar{width:min(88vw,310px);transform:translateX(-105%);transition:transform .2s ease;z-index:1200;padding-top:14px}.sidebar.open{transform:translateX(0)}
 .overlay{position:fixed;inset:0;background:rgba(0,0,0,.42);z-index:1100}.overlay.show{display:block}
 .main{margin-left:0;padding:0 12px 24px}.mobilebar{position:sticky;top:0;z-index:100;background:rgba(247,246,242,.96);backdrop-filter:blur(10px);display:flex;align-items:center;justify-content:space-between;gap:8px;padding:10px 0;border-bottom:1px solid var(--line)}
 .mobilebar strong{font-size:16px}.hamb{border:1px solid var(--line);background:#fff;border-radius:10px;padding:9px 11px;cursor:pointer}.topbar{position:static;padding:15px 2px 8px}.topbar h1{font-size:25px}.session{font-size:12px}.card{padding:16px;border-radius:17px}.form-grid{grid-template-columns:1fr}.field.full{grid-column:auto}.banner-row{align-items:flex-start;flex-direction:column}.banner-row img{width:100%;height:auto;max-height:180px}.banner-row .btn{width:100%}
}
</style>
</head>
<body>
<div id="app"><div class="card loading">Cargando panel administrativo...</div></div>
<script src="../config.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script>
(function(){'use strict';
const LOGO='https://i.ibb.co/tw6GTfyV/Dise-o-sin-t-tulo-12.png';
let sb=null,currentUser=null,refreshTimer=null;
const $=id=>document.getElementById(id);
const esc=v=>{const d=document.createElement('div');d.textContent=v==null?'':String(v);return d.innerHTML};
const errText=e=>e?.message||e?.error_description||String(e||'Error desconocido');
function table(n){return sb.from(n)}
function closeMobile(){ $('sidebar')?.classList.remove('open');$('overlay')?.classList.remove('show') }
window.toggleMenu=()=>{$('sidebar')?.classList.toggle('open');$('overlay')?.classList.toggle('show')};
window.signout=async()=>{if(sb)await sb.auth.signOut();location.href='./index.html'};
function setActive(s){document.querySelectorAll('[data-section]').forEach(b=>b.classList.toggle('active',b.dataset.section===s))}
async function init(){
 if(!window.supabase){return fatal('No se pudo cargar la librería de Supabase.')}
 const key=window.SUPABASE_PUBLISHABLE_KEY||window.SUPABASE_KEY;
 if(!window.SUPABASE_URL||!key)return fatal('Faltan SUPABASE_URL y la clave pública en config.js.');
 sb=window.supabase.createClient(window.SUPABASE_URL,key);window.supabaseClient=sb;
 const {data:{session},error}=await sb.auth.getSession();
 if(error)return fatal(errText(error)); if(!session){location.href='./index.html';return}
 currentUser=session.user;
 const {data:admin,error:ae}=await table('admins').select('id').eq('id',session.user.id).maybeSingle();
 if(ae)return fatal('No se pudo comprobar el administrador: '+errText(ae));
 if(!admin)return fatal('<h2>Usuario no autorizado</h2><p>'+esc(session.user.email)+'</p><button class="btn secondary" onclick="signout()">Cerrar sesión</button>',true);
 render();
}
function fatal(msg,html=false){$('app').innerHTML='<div style="padding:25px"><div class="error">'+(html?msg:esc(msg))+'</div></div>'}
function render(){
 $('app').innerHTML=`<div class="app"><aside class="sidebar" id="sidebar"><div class="brand"><img src="${LOGO}" alt="Jóvenes Influencers del Señor"><h2>Panel administrativo</h2></div><nav class="menu">
 ${[['dashboard','📊 Dashboard'],['noticias','📰 Noticias'],['programas','🎬 Los 11 programas'],['episodios','🎞️ Episodios'],['envivo','🔴 En Vivo'],['banner','🖼️ Publicidad / Banner'],['datos64','✝️ 64 Datos'],['diocesis','⛪ Diócesis'],['parroquias','⛪ Parroquias'],['equipo','👥 Integrantes / Quiénes somos'],['editorial','✍️ Editorial'],['usuarios','👤 Usuarios / administradores'],['configuracion','⚙️ Configuración']].map(x=>`<button data-section="${x[0]}" onclick="showSection('${x[0]}')">${x[1]}</button>`).join('')}
 <hr><button onclick="signout()">🚪 Cerrar sesión</button></nav></aside><div class="overlay" id="overlay" onclick="closeMobile()"></div>
 <main class="main"><div class="mobilebar"><button class="hamb" onclick="toggleMenu()">☰ Menú</button><strong>Jóvenes Influencers</strong></div><header class="topbar"><div><h1>Panel administrativo</h1><div class="session">Sesión: <strong>${esc(currentUser.email)}</strong></div></div><div class="toolbar"><button class="btn secondary" onclick="refreshCurrent()">↻ Actualizar</button></div></header><div id="contenido-panel"></div></main></div>`;
 showSection('dashboard');
 refreshTimer=setInterval(()=>{if(document.visibilityState==='visible')refreshCurrent(true)},30000);
}
window.showSection=async s=>{closeMobile();setActive(s);const c=$('contenido-panel');c.innerHTML='<div class="card loading">Cargando...</div>';if(s==='dashboard')return dashboard();if(s==='banner')return banner();if(s==='configuracion')return configuracion();return generic(s)};
window.refreshCurrent=async silent=>{const active=document.querySelector('.menu button.active')?.dataset.section||'dashboard';if(!silent)$('contenido-panel').innerHTML='<div class="card loading">Actualizando...</div>';await showSection(active)};
async function count(t){try{const r=await table(t).select('*',{count:'exact',head:true});return r.error?0:(r.count||0)}catch{return 0}}
async function dashboard(){const c=$('contenido-panel');const vals=await Promise.all(['news','programs','episodes','live_streams','historical_64','editorials','team_members'].map(count));c.innerHTML=`<div class="card"><h2>📊 Dashboard</h2><p class="muted">Los datos se actualizan automáticamente cada 30 segundos.</p></div><div class="grid">${[['Noticias',vals[0]],['Programas',vals[1]],['Episodios',vals[2]],['En vivo',vals[3]],['64 datos',vals[4]],['Editoriales',vals[5]],['Integrantes',vals[6]]].map(x=>`<div class="card"><div>${x[0]}</div><div class="number">${x[1]}</div></div>`).join('')}</div>`}
async function banner(){const c=$('contenido-panel');c.innerHTML=`<div class="card"><h2>🖼️ Publicidad / Banner</h2><p class="muted">Aquí administras las imágenes que aparecerán en la página. Se muestran una a una, en el mismo espacio, con transición fade y 5 segundos por imagen.</p><div id="bannerStatus"></div><form id="bannerForm" class="form-grid"><div class="field full"><label>URL de la imagen</label><input id="bannerUrl" type="url" required placeholder="https://ejemplo.com/banner.jpg"></div><div class="field"><label>Duración (segundos)</label><input id="bannerSeconds" type="number" min="1" max="3600" value="5" required></div><div class="field" style="display:flex;align-items:end"><button class="btn primary" type="submit">＋ Agregar publicidad</button></div></form></div><div class="card"><h2>📋 Publicidades registradas</h2><div id="bannerList" class="banner-list"><div class="loading">Cargando...</div></div></div>`;$('bannerForm').onsubmit=saveBanner;await loadBanners()}
async function saveBanner(e){e.preventDefault();const msg=$('bannerStatus'),url=$('bannerUrl').value.trim(),seconds=Math.max(1,parseInt($('bannerSeconds').value,10)||5);msg.className='';msg.textContent='Guardando...';let r=await table('banners').insert({image_url:url,duration_seconds:seconds});if(r.error){msg.className='error';msg.textContent='No se pudo guardar: '+errText(r.error);return}msg.className='ok';msg.textContent='Publicidad guardada correctamente.';$('bannerUrl').value='';await loadBanners()}
async function loadBanners(){const box=$('bannerList');if(!box)return;let r=await table('banners').select('*').order('created_at',{ascending:true});if(r.error){box.innerHTML='<div class="error">No se pudieron cargar las publicidades: '+esc(errText(r.error))+'<br><br>Ejecuta el SQL de reparación incluido en el ZIP.</div>';return}const rows=r.data||[];box.innerHTML=rows.length?rows.map(x=>`<div class="banner-row"><img src="${esc(x.image_url)}" alt="Publicidad"><div class="grow"><strong>Publicidad</strong><div class="small muted">${esc(x.duration_seconds||5)} segundos</div><div class="small url">${esc(x.image_url)}</div></div><button class="btn danger" onclick="deleteBanner('${esc(x.id)}')">Eliminar</button></div>`).join(''):'<div class="muted">No hay publicidades registradas.</div>'}
window.deleteBanner=async id=>{if(!confirm('¿Eliminar esta publicidad?'))return;const r=await table('banners').delete().eq('id',id);if(r.error)alert(errText(r.error));else loadBanners()}
async function configuracion(){const c=$('contenido-panel');c.innerHTML=`<div class="card"><h2>⚙️ Configuración del sitio</h2><p class="muted">Esta configuración usa una tabla independiente <code>site_settings</code> para evitar el error <code>invalid input syntax for type integer: "true"</code>. Los valores se guardan como texto y los interruptores se convierten internamente a 1/0.</p><div id="configStatus"></div><form id="configForm" class="form-grid"><div class="field"><label>Nombre del sitio</label><input id="siteName" placeholder="Jóvenes Influencers del Señor"></div><div class="field"><label>Texto del pie de página</label><input id="footerText" placeholder="Comunicación al servicio de Dios."></div><div class="field"><label>Creado por</label><input id="createdBy" placeholder="Gamarra TV"></div><div class="field"><label>Mostrar publicidad</label><select id="showAds"><option value="1">Sí</option><option value="0">No</option></select></div><div class="field full"><label>Logo del sitio (URL)</label><input id="siteLogo" type="url" placeholder="https://..."></div><div class="field full"><button class="btn primary">Guardar configuración</button></div></form></div>`;$('configForm').onsubmit=saveConfig;await loadConfig()}
async function loadConfig(){const keys=['site_name','footer_text','created_by','show_ads','site_logo'];const r=await table('site_settings').select('key,value').in('key',keys);if(r.error){$('configStatus').className='warn';$('configStatus').textContent='La configuración necesita la tabla site_settings. Ejecuta supabase_reparacion.sql incluido en el ZIP.';return}const m=Object.fromEntries((r.data||[]).map(x=>[x.key,x.value]));$('siteName').value=m.site_name||'';$('footerText').value=m.footer_text||'';$('createdBy').value=m.created_by||'';$('showAds').value=m.show_ads==='0'?'0':'1';$('siteLogo').value=m.site_logo||''}
async function saveConfig(e){e.preventDefault();const msg=$('configStatus');const values=[['site_name',$('siteName').value],['footer_text',$('footerText').value],['created_by',$('createdBy').value],['show_ads',$('showAds').value==='1'?'1':'0'],['site_logo',$('siteLogo').value]];const r=await table('site_settings').upsert(values.map(([key,value])=>({key,value,updated_at:new Date().toISOString()})),{onConflict:'key'});if(r.error){msg.className='error';msg.textContent='No se pudo guardar: '+errText(r.error);return}msg.className='ok';msg.textContent='Configuración guardada correctamente. No se envían booleanos a columnas integer.'}
function generic(s){const titles={noticias:'📰 Noticias',programas:'🎬 Los 11 programas',episodios:'🎞️ Episodios',envivo:'🔴 En Vivo',datos64:'✝️ 64 Datos',diocesis:'⛪ Diócesis',parroquias:'⛪ Parroquias',equipo:'👥 Integrantes / Quiénes somos',editorial:'✍️ Editorial',usuarios:'👤 Usuarios / administradores'};$('contenido-panel').innerHTML=`<div class="card"><h2>${esc(titles[s]||s)}</h2><p class="muted">Sección disponible en el panel. La navegación permanece fija y adaptada para PC y celular.</p></div>`}
init();
})();
</script>
</body></html>
