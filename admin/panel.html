<!doctype html><html lang='es'><head><meta charset='utf-8'><meta http-equiv='refresh' content='0;url=/admin/index.html'><script>location.replace('/admin/index.html')</script>
<style id="menu-pagina-v11">
/* Menú público v11: limpio, centrado, responsive y accesible */
.site-header, header{
  position:sticky;top:0;z-index:900;
  background:rgba(255,255,255,.97);
  backdrop-filter:blur(10px);
  border-bottom:1px solid rgba(0,0,0,.08);
}
.site-nav, nav.main-nav, header nav{
  width:100%;max-width:1200px;margin:0 auto;
  display:flex;align-items:center;justify-content:center;
  gap:6px;padding:10px 16px;
  flex-wrap:wrap;
}
.site-nav a, nav.main-nav a, header nav a{
  display:inline-flex;align-items:center;justify-content:center;
  min-height:42px;padding:9px 14px;border-radius:10px;
  color:inherit;text-decoration:none;font-weight:700;
  white-space:nowrap;transition:.2s ease;
}
.site-nav a:hover, nav.main-nav a:hover, header nav a:hover{
  background:rgba(93,125,66,.12);
}
.menu-toggle{
  display:none;border:0;background:#5d7d42;color:#fff;
  border-radius:10px;padding:10px 14px;font-weight:800;cursor:pointer;
}
@media(max-width:900px){
  .menu-toggle{display:inline-flex;align-items:center;gap:7px}
  .site-nav, nav.main-nav, header nav{
    justify-content:flex-start;
    max-width:none;
    padding:8px 12px;
  }
  .site-nav .nav-links, nav.main-nav .nav-links, header nav .nav-links{
    display:none;width:100%;flex-direction:column;align-items:stretch;
    padding-top:8px;
  }
  .site-nav.open .nav-links, nav.main-nav.open .nav-links,
  header nav.open .nav-links{display:flex}
  .site-nav a, nav.main-nav a, header nav a{
    width:100%;justify-content:flex-start;
    min-height:46px;
  }
}
@media(max-width:520px){
  .site-header, header{position:sticky}
  .site-nav, nav.main-nav, header nav{padding:7px 10px}
}
</style>
</head><body>
<a id="btn-ver-pagina" href="../index.html" target="_blank"
   style="display:inline-flex;align-items:center;gap:8px;margin:10px 0;
          padding:10px 16px;border-radius:10px;background:#5d7d42;color:#fff;
          text-decoration:none;font-weight:700;box-shadow:0 3px 10px rgba(0,0,0,.12);">
  🌐 Ver página
</a>
Abriendo panel...</body></html>
