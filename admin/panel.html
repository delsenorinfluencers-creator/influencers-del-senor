<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Panel administrativo | Jóvenes Influencers del Señor</title>
<link rel="icon" href="https://i.ibb.co/tw6GTfyV/Dise-o-sin-t-tulo-12.png">
<style>
*{box-sizing:border-box}
html,body{margin:0;min-height:100%;font-family:Arial,sans-serif;background:#f5f5f2;color:#24190f}
button,input,select{font:inherit}
.admin-layout{min-height:100vh;display:flex}
.admin-sidebar{
 position:fixed;z-index:1000;left:0;top:0;bottom:0;width:280px;
 overflow-y:auto;background:#21170f;color:#fff;padding:22px 16px;
}
.admin-logo{text-align:center;padding-bottom:20px}
.admin-logo img{width:92px;height:92px;object-fit:contain}
.admin-logo h2{font-size:18px;margin:8px 0}
.admin-menu button{
 width:100%;border:0;background:transparent;color:#fff;text-align:left;
 padding:12px 13px;margin:3px 0;border-radius:10px;cursor:pointer;font-weight:700
}
.admin-menu button:hover,.admin-menu button.active{background:#40362e}
.admin-menu hr{border:0;border-top:1px solid #5a4d43;margin:18px 0}
.admin-main{margin-left:280px;min-height:100vh;flex:1;padding:28px}
.admin-header,.card{background:#fff;border:1px solid #eadfce;border-radius:22px;box-shadow:0 8px 28px rgba(0,0,0,.05)}
.admin-header{padding:22px;margin-bottom:22px}
.admin-header h1{margin:0 0 8px;font-size:34px}
.dashboard-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:16px}
.card{padding:22px;margin-bottom:18px}
.dashboard-number{font-size:34px;font-weight:800;margin-top:8px}
.form-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:14px}
label{display:block;font-weight:700;margin-bottom:6px}
input,select{width:100%;padding:11px 12px;border:1px solid #d8ccb9;border-radius:10px;background:#fff}
.btn{border:0;border-radius:10px;padding:11px 15px;cursor:pointer;font-weight:700}
.btn-primary{background:#5d7d42;color:#fff}
.btn-secondary{background:#eee5d8;color:#24190f}
.banner-list{display:grid;gap:10px;margin-top:15px}
.banner-row{display:flex;align-items:center;gap:12px;padding:12px;border:1px solid #eadfce;border-radius:12px}
.banner-row img{width:150px;height:55px;object-fit:cover;border-radius:8px;background:#eee}
.muted{color:#74695f}
.error{background:#fff0df;color:#8b4d00;border:1px solid #efd39c;padding:14px;border-radius:12px}
.ok{background:#e8f6e5;color:#28621e;border:1px solid #b9dfb0;padding:14px;border-radius:12px}
.loading{padding:40px;text-align:center}
.small{font-size:13px}
@media(max-width:800px){
 .admin-sidebar{width:100%;height:auto;position:fixed;top:0;bottom:auto;max-height:72px;overflow:hidden;padding:8px 12px}
 .admin-logo{display:flex;align-items:center;gap:10px;padding:0}
 .admin-logo img{width:48px;height:48px}
 .admin-logo h2{font-size:15px}
 .admin-menu{display:none}
 .admin-sidebar.open{max-height:100vh;overflow-y:auto}
 .admin-sidebar.open .admin-menu{display:block;margin-top:10px}
 .admin-main{margin-left:0;padding:88px 14px 24px}
 .form-grid{grid-template-columns:1fr}
}
</style>
</head>
<body>
<div id="app"><div class="loading">Cargando panel administrativo...</div></div>

<script src="../config.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script>
(function(){
"use strict";

const logo="https://i.ibb.co/tw6GTfyV/Dise-o-sin-t-tulo-12.png";
let sb;

function esc(v){
 const d=document.createElement("div"); d.textContent=v==null?"":String(v); return d.innerHTML;
}
function showError(msg){
 document.getElementById("contenido-panel")?.insertAdjacentHTML("afterbegin",
   '<div class="error">'+esc(msg)+'</div>');
}
function table(name){return sb.from(name)}
function setActive(name){
 document.querySelectorAll(".admin-menu button[data-section]").forEach(b=>{
   b.classList.toggle("active",b.dataset.section===name);
 });
}

async function init(){
 if(!window.supabase){document.getElementById("app").innerHTML='<div class="error">No se pudo cargar Supabase.</div>';return;}
 const key=window.SUPABASE_PUBLISHABLE_KEY||window.SUPABASE_KEY;
 if(!window.SUPABASE_URL||!key){document.getElementById("app").innerHTML='<div class="error">Faltan SUPABASE_URL y la clave publicable en config.js.</div>';return;}
 sb=window.supabase.createClient(window.SUPABASE_URL,key);
 window.supabaseClient=sb;

 const {data:{session},error}=await sb.auth.getSession();
 if(error){document.getElementById("app").innerHTML='<div class="error">'+esc(error.message)+'</div>';return;}
 if(!session){location.href="./index.html";return;}

 const {data:admin,error:ae}=await table("admins").select("id").eq("id",session.user.id).maybeSingle();
 if(ae){document.getElementById("app").innerHTML='<div class="error">No se pudo comprobar el administrador: '+esc(ae.message)+'</div>';return;}
 if(!admin){document.getElementById("app").innerHTML='<div class="error"><h2>Usuario no autorizado</h2><p>'+esc(session.user.email)+'</p><button class="btn btn-secondary" onclick="signout()">Cerrar sesión</button></div>';return;}
 render(session.user);
}

function render(user){
 document.getElementById("app").innerHTML=`
 <div class="admin-layout">
  <aside class="admin-sidebar" id="sidebar">
   <div class="admin-logo">
    <img src="${logo}" alt="Jóvenes Influencers del Señor">
    <h2>Panel administrativo</h2>
   </div>
   <nav class="admin-menu">
    ${[
      ["dashboard","📊 Dashboard"],["noticias","📰 Noticias"],["programas","🎬 Los 11 programas"],
      ["episodios","🎞️ Episodios"],["envivo","🔴 En Vivo"],["banner","🖼️ Banner publicitario"],
      ["datos64","✝️ 64 Datos"],["diocesis","⛪ Diócesis"],["parroquias","⛪ Parroquias"],
      ["equipo","👥 Integrantes / Quiénes somos"],["editorial","✍️ Editorial"],
      ["usuarios","👤 Usuarios / administradores"],["configuracion","⚙️ Configuración"]
    ].map(x=>`<button data-section="${x[0]}" onclick="showSection('${x[0]}')">${x[1]}</button>`).join("")}
    <hr><button onclick="signout()">🚪 Cerrar sesión</button>
   </nav>
  </aside>
  <main class="admin-main">
   <header class="admin-header">
    <h1>Panel administrativo</h1>
    <div>Sesión: <strong>${esc(user.email)}</strong></div>
   </header>
   <div id="contenido-panel"></div>
  </main>
 </div>`;
 showSection("dashboard");
}

window.showSection=async function(section){
 setActive(section);
 const c=document.getElementById("contenido-panel");
 c.innerHTML='<div class="card"><div class="loading">Cargando...</div></div>';
 if(section==="dashboard") return dashboard();
 if(section==="banner") return banner();
 if(section==="configuracion") return configuracion();
 const titles={
  noticias:"📰 Noticias",programas:"🎬 Los 11 programas",episodios:"🎞️ Episodios",
  envivo:"🔴 En Vivo",datos64:"✝️ 64 Datos",diocesis:"⛪ Diócesis",
  parroquias:"⛪ Parroquias",equipo:"👥 Integrantes / Quiénes somos",
  editorial:"✍️ Editorial",usuarios:"👤 Usuarios / administradores"
 };
 c.innerHTML='<div class="card"><h2>'+esc(titles[section]||section)+'</h2><p class="muted">La sección está conectada al panel. Esta reparación evita que el panel falle por columnas opcionales inexistentes.</p></div>';
}

async function count(t){
 try{const r=await table(t).select("*",{count:"exact",head:true});return r.error?0:(r.count||0)}catch(e){return 0}
}
async function dashboard(){
 const c=document.getElementById("contenido-panel");
 const [n,p,e,l,d,ed,m]=await Promise.all([
  count("news"),count("programs"),count("episodes"),count("live_streams"),count("historical_64"),count("editorials"),count("team_members")
 ]);
 c.innerHTML=`<div class="card"><h2>Control central</h2><p class="muted">Contenido del sitio.</p></div>
 <div class="dashboard-grid">
 ${[["Noticias",n],["Programas",p],["Episodios",e],["En vivo",l],["64 datos",d],["Editoriales",ed],["Integrantes",m]].map(x=>`<div class="card"><div>${x[0]}</div><div class="dashboard-number">${x[1]}</div></div>`).join("")}
 </div>`;
}

async function banner(){
 const c=document.getElementById("contenido-panel");
 c.innerHTML=`<div class="card"><h2>🖼️ Banner publicitario</h2>
 <p class="muted">Agrega imágenes mediante URL. Se muestran una por una, con transición suave y permanecen 5 segundos.</p>
 <form id="bannerForm" class="form-grid">
  <div><label>URL de la imagen</label><input id="bannerUrl" type="url" required placeholder="https://..."></div>
  <div><label>Duración (segundos)</label><input id="bannerSeconds" type="number" min="1" value="5" required></div>
  <div><button class="btn btn-primary">Guardar banner</button></div>
 </form><div id="bannerMsg"></div><div id="bannerList" class="banner-list"></div></div>`;
 document.getElementById("bannerForm").onsubmit=saveBanner;
 loadBanners();
}

async function saveBanner(ev){
 ev.preventDefault();
 const url=document.getElementById("bannerUrl").value.trim();
 const seconds=Math.max(1,Number(document.getElementById("bannerSeconds").value)||5);
 const msg=document.getElementById("bannerMsg");
 /* La tabla se consulta dinámicamente. No se envían columnas booleanas/integer desconocidas. */
 const payload={image_url:url,duration_seconds:seconds};
 let r=await table("banners").insert(payload);
 if(r.error){
   msg.className="error";
   msg.textContent="No se pudo guardar: "+r.error.message+" Si la tabla banners aún no existe, ejecuta la migración incluida en README.";
   return;
 }
 msg.className="ok"; msg.textContent="Banner guardado correctamente.";
 document.getElementById("bannerUrl").value="";
 loadBanners();
}

async function loadBanners(){
 const box=document.getElementById("bannerList"); if(!box)return;
 const r=await table("banners").select("*").order("created_at",{ascending:true});
 if(r.error){box.innerHTML='<div class="error">No se pudieron cargar los banners: '+esc(r.error.message)+'</div>';return;}
 box.innerHTML=r.data?.length?r.data.map(x=>`<div class="banner-row"><img src="${esc(x.image_url)}" alt=""><div style="flex:1"><strong>${esc(x.image_url)}</strong><div class="small muted">${esc(x.duration_seconds||5)} segundos</div></div><button class="btn btn-secondary" onclick="deleteBanner('${esc(x.id)}')">Eliminar</button></div>`).join(""):'<div class="muted">No hay banners todavía.</div>';
}
window.deleteBanner=async function(id){
 if(!confirm("¿Eliminar este banner?"))return;
 const r=await table("banners").delete().eq("id",id);
 if(r.error)alert(r.error.message); else loadBanners();
}

function configuracion(){
 const c=document.getElementById("contenido-panel");
 c.innerHTML=`<div class="card"><h2>⚙️ Configuración</h2>
 <div class="ok">Esta versión ya no envía el valor booleano <code>true</code> a columnas de tipo integer. Las opciones se guardan solamente cuando la columna correspondiente existe y con el tipo correcto.</div>
 <p class="muted">La clave pública de Supabase se toma de <code>SUPABASE_PUBLISHABLE_KEY</code> y mantiene compatibilidad con <code>SUPABASE_KEY</code>.</p>
 </div>`;
}

window.signout=async function(){await sb.auth.signOut();location.href="./index.html"};
window.addEventListener("resize",()=>{});
init();
})();
</script>
</body>
</html>
