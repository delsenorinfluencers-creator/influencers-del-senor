<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">

  <title>Panel administrativo | Jóvenes Influencers del Señor</title>

  <link rel="icon"
        href="https://i.ibb.co/tw6GTfyV/Dise-o-sin-t-tulo-12.png">

  <link rel="stylesheet" href="../estilos.css">

  <style>
    body {
      margin: 0;
      background: #f7f7f7;
      font-family: Arial, sans-serif;
    }

    .admin-layout {
      min-height: 100vh;
      display: flex;
    }

    .admin-sidebar {
      width: 250px;
      background: #111;
      color: white;
      padding: 20px;
      box-sizing: border-box;
    }

    .admin-logo {
      text-align: center;
      margin-bottom: 30px;
    }

    .admin-logo img {
      width: 100px;
      height: 100px;
      object-fit: contain;
    }

    .admin-logo h2 {
      font-size: 18px;
      margin: 10px 0;
    }

    .admin-menu button {
      width: 100%;
      display: block;
      border: 0;
      background: transparent;
      color: white;
      text-align: left;
      padding: 13px 10px;
      margin-bottom: 5px;
      border-radius: 8px;
      cursor: pointer;
      font-size: 15px;
    }

    .admin-menu button:hover {
      background: #333;
    }

    .admin-main {
      flex: 1;
      padding: 30px;
      box-sizing: border-box;
    }

    .admin-header {
      background: white;
      padding: 20px;
      border-radius: 12px;
      margin-bottom: 25px;
      box-shadow: 0 2px 10px rgba(0,0,0,.06);
    }

    .dashboard-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(190px, 1fr));
      gap: 20px;
    }

    .dashboard-card {
      background: white;
      border-radius: 12px;
      padding: 25px;
      box-shadow: 0 2px 10px rgba(0,0,0,.06);
    }

    .dashboard-card h3 {
      margin-top: 0;
    }

    .dashboard-number {
      font-size: 32px;
      font-weight: bold;
    }

    .loading {
      padding: 30px;
      text-align: center;
    }

    .error {
      background: #ffe5e5;
      color: #a00000;
      padding: 15px;
      border-radius: 8px;
      margin-bottom: 20px;
    }

    @media (max-width: 800px) {
      .admin-layout {
        display: block;
      }

      .admin-sidebar {
        width: 100%;
      }
    }
  </style>
</head>

<body>

<div id="app">
  <div class="loading">
    Cargando panel administrativo...
  </div>
</div>

<!-- 1. Configuración de Supabase -->
<script src="../config.js"></script>

<!-- 2. Librería oficial de Supabase -->
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<!-- 3. Panel -->
<script>
(function () {

  console.log("Iniciando panel administrativo...");

  // Comprobar que Supabase se cargó
  if (!window.supabase) {
    document.getElementById("app").innerHTML = `
      <div class="error">
        <strong>Error:</strong> No se pudo cargar Supabase.
        <br><br>
        Comprueba tu conexión a Internet.
      </div>
    `;
    return;
  }

  // Comprobar configuración
  if (!window.SUPABASE_URL || !window.SUPABASE_KEY) {
    document.getElementById("app").innerHTML = `
      <div class="error">
        <strong>Error de configuración.</strong>
        <br><br>
        No se encontraron las variables de Supabase en config.js.
      </div>
    `;
    return;
  }

  // Crear cliente
  const supabaseClient = window.supabase.createClient(
    window.SUPABASE_URL,
    window.SUPABASE_KEY
  );

  // Hacerlo global para los demás módulos
  window.supabaseClient = supabaseClient;

  console.log("Supabase inicializado correctamente.");

  iniciarPanel();

  async function iniciarPanel() {

    const {
      data: { session },
      error: sessionError
    } = await supabaseClient.auth.getSession();

    if (sessionError) {
      mostrarError(sessionError.message);
      return;
    }

    if (!session) {
      window.location.href = "./index.html";
      return;
    }

    const usuario = session.user;

    console.log("Usuario conectado:", usuario.email);

    // Comprobar administrador
    const { data: admin, error: adminError } =
      await supabaseClient
        .from("admins")
        .select("id")
        .eq("id", usuario.id)
        .maybeSingle();

    if (adminError) {
      mostrarError(
        "No se pudo comprobar el administrador: " +
        adminError.message
      );
      return;
    }

    if (!admin) {
      document.getElementById("app").innerHTML = `
        <div class="error">
          <h2>Usuario no autorizado</h2>
          <p>
            El usuario inició sesión correctamente,
            pero todavía no está registrado como administrador.
          </p>
          <p>
            Usuario:
            <strong>${escapeHtml(usuario.email)}</strong>
          </p>
          <button onclick="cerrarSesion()">
            Cerrar sesión
          </button>
        </div>
      `;
      return;
    }

    mostrarPanel(usuario);
  }

  function mostrarPanel(usuario) {

    document.getElementById("app").innerHTML = `

      <div class="admin-layout">

        <aside class="admin-sidebar">

          <div class="admin-logo">

            <img
              src="https://i.ibb.co/tw6GTfyV/Dise-o-sin-t-tulo-12.png"
              alt="Jóvenes Influencers del Señor">

            <h2>
              Panel administrativo
            </h2>

          </div>

          <nav class="admin-menu">

            <button onclick="mostrarSeccion('dashboard')">
              📊 Dashboard
            </button>

            <button onclick="mostrarSeccion('noticias')">
              📰 Iglesia al Día
            </button>

            <button onclick="mostrarSeccion('programas')">
              🎬 Programas
            </button>

            <button onclick="mostrarSeccion('envivo')">
              🔴 En Vivo
            </button>

            <button onclick="mostrarSeccion('datos64')">
              ✝️ 64 Datos
            </button>

            <button onclick="mostrarSeccion('diocesis')">
              ⛪ Diócesis
            </button>

            <button onclick="mostrarSeccion('editorial')">
              ✍️ Editorial
            </button>

            <button onclick="mostrarSeccion('equipo')">
              👥 Quiénes somos
            </button>

            <button onclick="mostrarSeccion('usuarios')">
              👤 Usuarios
            </button>

            <button onclick="mostrarSeccion('configuracion')">
              ⚙️ Configuración
            </button>

            <hr>

            <button onclick="cerrarSesion()">
              🚪 Cerrar sesión
            </button>

          </nav>

        </aside>

        <main class="admin-main">

          <div class="admin-header">

            <h1>
              Panel administrativo
            </h1>

            <p>
              Bienvenido,
              <strong>${escapeHtml(usuario.email)}</strong>
            </p>

          </div>

          <div id="contenido-panel">

            <div class="dashboard-grid">

              <div class="dashboard-card">
                <h3>📰 Noticias</h3>
                <div class="dashboard-number" id="totalNoticias">
                  ...
                </div>
              </div>

              <div class="dashboard-card">
                <h3>🎬 Programas</h3>
                <div class="dashboard-number" id="totalProgramas">
                  ...
                </div>
              </div>

              <div class="dashboard-card">
                <h3>🎥 Episodios</h3>
                <div class="dashboard-number" id="totalEpisodios">
                  ...
                </div>
              </div>

              <div class="dashboard-card">
                <h3>✝️ 64 Datos</h3>
                <div class="dashboard-number" id="totalDatos">
                  ...
                </div>
              </div>

            </div>

          </div>

        </main>

      </div>
    `;

    cargarResumen();
  }

  async function cargarResumen() {

    contarTabla("news", "totalNoticias");
    contarTabla("programs", "totalProgramas");
    contarTabla("episodes", "totalEpisodios");
    contarTabla("historical_64", "totalDatos");

  }

  async function contarTabla(tabla, elemento) {

    try {

      const { count, error } =
        await supabaseClient
          .from(tabla)
          .select("*", {
            count: "exact",
            head: true
          });

      if (!error) {
        const el = document.getElementById(elemento);

        if (el) {
          el.textContent = count ?? 0;
        }
      }

    } catch (error) {

      console.error(
        "Error consultando",
        tabla,
        error
      );

    }
  }

  window.mostrarSeccion = function (seccion) {

    const contenido =
      document.getElementById("contenido-panel");

    const nombres = {
      dashboard: "📊 Dashboard",
      noticias: "📰 Iglesia al Día",
      programas: "🎬 Programas",
      envivo: "🔴 En Vivo",
      datos64: "✝️ 64 Datos Históricos",
      diocesis: "⛪ Diócesis",
      editorial: "✍️ Editorial",
      equipo: "👥 Quiénes somos",
      usuarios: "👤 Usuarios",
      configuracion: "⚙️ Configuración"
    };

    contenido.innerHTML = `
      <div class="dashboard-card">
        <h2>${nombres[seccion] || "Sección"}</h2>
        <p>
          Esta sección del panel administrativo está disponible
          para gestionar el contenido.
        </p>
      </div>
    `;

  };

  window.cerrarSesion = async function () {

    await supabaseClient.auth.signOut();

    window.location.href = "./index.html";

  };

  function mostrarError(mensaje) {

    document.getElementById("app").innerHTML = `
      <div style="padding:40px">
        <div class="error">
          <h2>Error</h2>
          <p>${escapeHtml(mensaje)}</p>
        </div>
      </div>
    `;

  }

  function escapeHtml(text) {

    const div = document.createElement("div");

    div.textContent = text;

    return div.innerHTML;

  }

})();
</script>

</body>
</html>
