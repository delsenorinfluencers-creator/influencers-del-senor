<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Panel administrativo | Jóvenes Influencers del Señor</title>
<link rel="icon" href="../logo-influencers-del-senor.png">
<link rel="stylesheet" href="../estilos.css">
<style>
:root{--bg:#f5f7f3;--card:#fff;--ink:#2d1f16;--accent:#b7c95a;--dark:#241b13}
*{box-sizing:border-box}body{margin:0;background:var(--bg);font-family:Arial,sans-serif;color:var(--ink)}
button,input,textarea,select{font:inherit}.admin-layout{min-height:100vh;display:flex}.admin-sidebar{width:270px;background:var(--dark);color:#fff;padding:18px;position:sticky;top:0;height:100vh;overflow:auto}.admin-logo{text-align:center}.admin-logo img{width:100px;height:100px;object-fit:contain}.admin-logo h2{font-size:18px;margin:8px 0 22px}.admin-menu button{width:100%;display:block;border:0;background:transparent;color:#fff;text-align:left;padding:12px 10px;margin:3px 0;border-radius:10px;cursor:pointer}.admin-menu button:hover,.admin-menu button.active{background:#40362e}.admin-main{flex:1;padding:26px;min-width:0}.admin-header,.card{background:var(--card);border-radius:18px;padding:20px;box-shadow:0 5px 24px rgba(0,0,0,.06);margin-bottom:18px}.dashboard-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(180px,1fr));gap:16px}.stat{font-size:32px;font-weight:800;margin-top:8px}.toolbar{display:flex;gap:10px;flex-wrap:wrap;margin-bottom:15px;align-items:center;justify-content:space-between}.btn{border:0;border-radius:10px;padding:10px 14px;cursor:pointer;background:var(--dark);color:#fff}.btn.alt{background:var(--accent);color:#18200d}.btn.danger{background:#a52b2b}.btn.light{background:#eee;color:#222}.form-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}.field{display:flex;flex-direction:column;gap:6px}.field.full{grid-column:1/-1}.field input,.field textarea,.field select{padding:10px;border:1px solid #ddd;border-radius:9px;background:#fff}.field textarea{min-height:110px}.table-wrap{overflow:auto}.data-table{width:100%;border-collapse:collapse}.data-table th,.data-table td{padding:10px;border-bottom:1px solid #eee;text-align:left;vertical-align:top}.notice{padding:13px;border-radius:10px;background:#fff4cf;margin-bottom:12px}.error{background:#ffe5e5;color:#8d0000;padding:15px;border-radius:10px;margin-bottom:15px}.success{background:#e8f7df;color:#2e671f;padding:15px;border-radius:10px;margin-bottom:15px}.muted{color:#6d655e}.modal{position:fixed;inset:0;background:rgba(0,0,0,.45);display:none;align-items:center;justify-content:center;padding:20px;z-index:10}.modal.open{display:flex}.modal-box{background:#fff;border-radius:16px;padding:22px;max-width:800px;width:100%;max-height:90vh;overflow:auto}@media(max-width:850px){.admin-layout{display:block}.admin-sidebar{position:static;width:100%;height:auto}.form-grid{grid-template-columns:1fr}}
</style>
</head>
<body>
<div id="app"><div class="card">Cargando panel administrativo...</div></div>
<script src="../config.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script>
(function(){
"use strict";
const app=document.getElementById("app");
const cfg=window.JIS_CONFIG||{};
const url=window.SUPABASE_URL;
const key=window.SUPABASE_PUBLISHABLE_KEY||window.SUPABASE_KEY;
if(!window.supabase){return fail("No se pudo cargar la librería de Supabase.");}
if(!url||!key){return fail("Falta SUPABASE_URL o SUPABASE_PUBLISHABLE_KEY en config.js.");}
const sb=window.supabase.createClient(url,key);
window.supabaseClient=sb;
const sections=[
["dashboard","📊 Dashboard"],["noticias","📰 Iglesia al Día"],["programas","🎬 Los 11 programas"],
["episodios","🎞️ Episodios"],["envivo","🔴 En Vivo"],["datos64","✝️ 64 Datos"],
["diocesis","⛪ Diócesis"],["parroquias","⛪ Parroquias"],["equipo","👥 Integrantes"],
["editorial","✍️ Editorial"],["usuarios","👤 Usuarios / administradores"],["configuracion","⚙️ Configuración"]
];
const state={user:null,current:"dashboard"};
function esc(v){return String(v??"").replace(/[&<>"']/g,m=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[m]));}
function fail(m){app.innerHTML='<div class="card error"><h2>Error</h2><p>'+esc(m)+'</p></div>';}
function msg(m,ok=true){const el=document.getElementById("flash");if(el){el.style.display="block";el.className=ok?"success":"error";el.textContent=m;setTimeout(()=>{el.remove()},3500);}}
async function init(){
 const {data:{session},error}=await sb.auth.getSession();
 if(error)return fail(error.message);
 if(!session){location.href="./index.html";return;}
 state.user=session.user;
 const {data:admin,error:ae}=await sb.from("admins").select("*").eq("id",state.user.id).maybeSingle();
 if(ae)return fail("No se pudo comprobar el administrador: "+ae.message);
 if(!admin)return unauthorized();
 renderShell(); await show("dashboard");
}
function unauthorized(){app.innerHTML='<div class="card error"><h2>Usuario no autorizado</h2><p>La cuenta inició sesión, pero su UUID todavía no está registrado en <b>admins</b>.</p><p>'+esc(state.user.email)+'</p><button class="btn" onclick="logout()">Cerrar sesión</button></div>';}
function renderShell(){
 app.innerHTML=`<div class="admin-layout">
 <aside class="admin-sidebar"><div class="admin-logo"><img src="${esc(cfg.logo||"../logo-influencers-del-senor.png")}" onerror="this.src='../logo-influencers-del-senor.png'"><h2>Panel administrativo</h2></div>
 <nav class="admin-menu">${sections.map(s=>`<button id="nav-${s[0]}" onclick="show('${s[0]}')">${s[1]}</button>`).join("")}<hr><button onclick="logout()">🚪 Cerrar sesión</button></nav></aside>
 <main class="admin-main"><div class="admin-header"><h1 id="section-title">Panel administrativo</h1><p>Bienvenido, <b>${esc(state.user.email)}</b></p></div><div id="flash" style="display:none"></div><div id="contenido-panel"></div></main></div>`;
}
window.show=async function(name){
 state.current=name;
 document.querySelectorAll(".admin-menu button").forEach(b=>b.classList.remove("active"));
 document.getElementById("nav-"+name)?.classList.add("active");
 document.getElementById("section-title").textContent=(sections.find(s=>s[0]===name)||["","Panel"])[1];
 const c=document.getElementById("contenido-panel"); c.innerHTML='<div class="card">Cargando...</div>';
 try{await ({dashboard:dashboard,noticias:news,programas:programs,episodios:episodes,envivo:live,datos64:data64,diocesis:diocese,parroquias:parishes,equipo:team,editorial:editorial,usuarios:admins,configuracion:settings}[name]||dashboard)();}
 catch(e){c.innerHTML='<div class="card error">'+esc(e.message||e)+'</div>';}
};
window.mostrarSeccion=window.show;
async function rows(table,limit=200){const r=await sb.from(table).select("*").limit(limit);if(r.error)throw r.error;return r.data||[];}
async function count(table){const r=await sb.from(table).select("*",{count:"exact",head:true});return r.error?null:r.count;}
async function dashboard(){
 const vals=await Promise.all(["news","programs","episodes","historical_64"].map(count));
 document.getElementById("contenido-panel").innerHTML='<div class="dashboard-grid">'+["📰 Noticias","🎬 Programas","🎞️ Episodios","✝️ 64 Datos"].map((x,i)=>`<div class="card"><h3>${x}</h3><div class="stat">${vals[i]??"—"}</div></div>`).join("")+'</div><div class="card"><h2>Panel conectado</h2><p class="muted">El panel no usa filtros booleanos rígidos como <code>.eq("published", true)</code>, evitando el error de columnas INTEGER que apareció en tu estructura.</p></div>';
}
function tableHtml(data,table){
 if(!data.length)return '<div class="notice">No hay registros todavía.</div>';
 const cols=Object.keys(data[0]).slice(0,8);
 return '<div class="table-wrap"><table class="data-table"><thead><tr>'+cols.map(c=>'<th>'+esc(c)+'</th>').join("")+'<th>Acciones</th></tr></thead><tbody>'+data.map(r=>'<tr>'+cols.map(c=>'<td>'+esc(typeof r[c]==="object"?JSON.stringify(r[c]):r[c])+'</td>').join("")+'<td><button class="btn light" onclick=\'editRecord('+JSON.stringify(table)+','+JSON.stringify(r)+')\'>Editar</button> <button class="btn danger" onclick=\'deleteRecord('+JSON.stringify(table)+','+JSON.stringify(r.id)+')\'>Eliminar</button></td></tr>').join("")+'</tbody></table></div>';
}
window.editRecord=function(table,row){openEditor(table,row);};
window.deleteRecord=async function(table,id){if(!confirm("¿Eliminar este registro?"))return;const r=await sb.from(table).delete().eq("id",id);if(r.error)return msg(r.error.message,false);msg("Registro eliminado.");show(state.current);};
function slugify(value){
 return String(value??"").normalize("NFD").replace(/[\u0300-\u036f]/g,"").toLowerCase().trim().replace(/[^a-z0-9]+/g,"-").replace(/^-+|-+$/g,"").slice(0,140);
}
function openEditor(table,row){
 const keys=Object.keys(row||{}).filter(k=>!["id","created_at","updated_at"].includes(k));
 if(!keys.length){return msg("La tabla no tiene columnas editables visibles en un registro. Crea primero un registro desde Supabase o dime su estructura para preparar el formulario.",false);}
 const form=keys.map(k=>{
   let v=row[k];
   let type=typeof v==="boolean"?"checkbox":"text";
   if(Array.isArray(v)||typeof v==="object")v=JSON.stringify(v??"");
   const isNewsTitle=table==="news"&&k==="title";
   const isNewsSlug=table==="news"&&k==="slug";
   if(isNewsTitle)return `<div class="field full"><label>Título</label><input type="text" data-k="title" id="news-title-input" value="${esc(v??"")}" oninput="document.getElementById('news-slug-input').value=slugify(this.value)"></div>`;
   if(isNewsSlug)return `<div class="field full"><label>Slug <span class="muted">(se genera automáticamente)</span></label><input type="text" data-k="slug" id="news-slug-input" value="${esc(v||slugify(row?.title||""))}" readonly></div>`;
   return `<div class="field"><label>${esc(k)}</label>${type==="checkbox"?`<input type="checkbox" data-k="${esc(k)}" ${v?"checked":""}>`:`<textarea data-k="${esc(k)}">${esc(v??"")}</textarea>`}</div>`;
 }).join("");
 document.getElementById("contenido-panel").insertAdjacentHTML("beforeend",`<div class="modal open" id="editorModal"><div class="modal-box"><h2>${row?.id?"Editar":"Nueva"} ${esc(table)}</h2><div class="form-grid">${form}</div><div class="toolbar" style="margin-top:16px"><button class="btn alt" onclick="saveEditor('${table}',${row?.id?JSON.stringify(row.id):"null"})">Guardar</button><button class="btn light" onclick="closeEditor()">Cancelar</button></div></div></div>`);
 if(table==="news"){const t=document.getElementById("news-title-input"),g=document.getElementById("news-slug-input");if(t&&g)g.value=slugify(t.value);}
}
window.closeEditor=()=>document.getElementById("editorModal")?.remove();
window.saveEditor=async function(table,id){
 const payload={};document.querySelectorAll("#editorModal [data-k]").forEach(el=>{payload[el.dataset.k]=el.type==="checkbox"?el.checked:el.value;});
 if(table==="news"&&payload.title!==undefined)payload.slug=slugify(payload.title);
 let r=id?await sb.from(table).update(payload).eq("id",id):await sb.from(table).insert(payload);
 if(r.error)return msg(r.error.message,false);closeEditor();msg(table==="news"?"Noticia guardada. Slug generado automáticamente.":"Guardado correctamente.");show(state.current);
};
window.newRecord=async function(table){
 const data=await rows(table);
 if(!data.length)return msg("La tabla está vacía. Para crear el primer registro necesito conocer sus columnas o que me envíes una captura de la estructura de la tabla.",false);
 const template=Object.fromEntries(Object.keys(data[0]).filter(k=>!["id","created_at","updated_at"].includes(k)).map(k=>[k,""]));
 openEditor(table,template);
};
async function section(table,title,button){
 const data=await rows(table);
 document.getElementById("contenido-panel").innerHTML=`<div class="card"><div class="toolbar"><div><h2>${title}</h2><p class="muted">Gestión conectada a Supabase sin asumir columnas que no existen.</p></div><button class="btn alt" onclick='newRecord(${JSON.stringify(table)})'>＋ ${button}</button></div>${tableHtml(data,table)}</div>`;
}
const news=()=>section("news","📰 Iglesia al Día","Nueva noticia");
const programs=()=>section("programs","🎬 Los 11 programas","Nuevo programa");
const episodes=()=>section("episodes","🎞️ Episodios","Nuevo episodio");
const live=()=>section("live_streams","🔴 En Vivo","Nueva transmisión");
const data64=()=>section("historical_64","✝️ 64 Datos Históricos","Nuevo dato");
const diocese=()=>section("diocese","⛪ Diócesis","Nuevo registro");
const parishes=()=>section("parishes","⛪ Parroquias","Nueva parroquia");
const team=()=>section("team_members","👥 Integrantes","Nuevo integrante");
const editorial=()=>section("editorials","✍️ Editorial","Nuevo artículo");
const admins=()=>section("admins","👤 Usuarios / administradores","Nuevo administrador");
const settings=()=>section("site_settings","⚙️ Configuración","Nueva configuración");
window.logout=async()=>{await sb.auth.signOut();location.href="./index.html";};
init();
})();
</script>
</body>
</html>
