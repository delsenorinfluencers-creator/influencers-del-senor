<style id="menu-pagina-v11">
/* Menú público v11: limpio, centrado, responsive y accesible */
.site-header, header{
  position:sticky;top:0;z-index:900;
  background:rgba(255,255,255,.97);
  backdrop-filter:blur(10px);
  border-bottom:1px solid rgba(0,0,0,.08);
}
.site-nav, nav.main-nav, header nav{
  width:100%;max-width:1200px;margin:0 auto;
  display:flex;align-items:center;justify-content:center;
  gap:6px;padding:10px 16px;
  flex-wrap:wrap;
}
.site-nav a, nav.main-nav a, header nav a{
  display:inline-flex;align-items:center;justify-content:center;
  min-height:42px;padding:9px 14px;border-radius:10px;
  color:inherit;text-decoration:none;font-weight:700;
  white-space:nowrap;transition:.2s ease;
}
.site-nav a:hover, nav.main-nav a:hover, header nav a:hover{
  background:rgba(93,125,66,.12);
}
.menu-toggle{
  display:none;border:0;background:#5d7d42;color:#fff;
  border-radius:10px;padding:10px 14px;font-weight:800;cursor:pointer;
}
@media(max-width:900px){
  .menu-toggle{display:inline-flex;align-items:center;gap:7px}

    justify-content:flex-start;
    max-width:none;
    padding:8px 12px;
  }
  .site-nav .nav-links, nav.main-nav .nav-links, header nav .nav-links{
    display:none;width:100%;flex-direction:column;align-items:stretch;
    padding-top:8px;
  }
  .site-nav.open .nav-links, nav.main-nav.open .nav-links,
  header nav.open .nav-links{display:flex}
  .site-nav a, nav.main-nav a, header nav a{
    width:100%;justify-content:flex-start;
    min-height:46px;
  }
}
@media(max-width:520px){
  .site-header, header{position:sticky}
  .site-nav, nav.main-nav, header nav{padding:7px 10px}
}
</style>

</head><body>
<a id="btn-ver-pagina" href="../index.html" target="_blank"
   style="display:inline-flex;align-items:center;gap:8px;margin:10px 0;
          padding:10px 16px;border-radius:10px;background:#5d7d42;color:#fff;
          text-decoration:none;font-weight:700;box-shadow:0 3px 10px rgba(0,0,0,.12);">
  🌐 Ver página
</a>
<main class="section"><div class="container" style="max-width:520px"><div class="card"><div style="text-align:center"><img data-logo src="" style="width:130px;height:130px;object-fit:contain" alt="Logo"><h1 style="font-size:38px">Iniciar sesión</h1><p class="lead" style="font-size:16px">Acceso exclusivo al panel administrativo.</p></div><form id="f"><div class="field"><label>Correo electrónico</label><input id="email" type="email" required autocomplete="username"></div><div class="field" style="margin-top:12px"><label>Contraseña</label><input id="pass" type="password" required autocomplete="current-password"></div><button class="btn" type="submit">Entrar al panel</button></form><div id="msg" class="notice hidden" style="margin-top:15px"></div><p style="margin-top:18px"><a href="/">← Volver al sitio</a></p></div></div></main><script src="/config.js"></script><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script src="/common.js"></script><script>
(async()=>{const sb=supabase.createClient(window.SUPABASE_URL,window.SUPABASE_PUBLISHABLE_KEY);const f=document.getElementById('f'),m=document.getElementById('msg');f.onsubmit=async e=>{e.preventDefault();m.classList.add('hidden');const r=await sb.auth.signInWithPassword({email:document.getElementById('email').value.trim(),password:document.getElementById('pass').value});if(r.error){m.textContent=r.error.message;m.classList.remove('hidden');return}const u=r.data.user;const a=await sb.from('admins').select('id').eq('id',u.id).maybeSingle();if(a.error||!a.data){await sb.auth.signOut();m.textContent='El usuario inició sesión, pero todavía no está autorizado como administrador. Agrega su UUID a la tabla admins.';m.classList.remove('hidden');return}location.href='/admin/'};})();
</script></body></html>
