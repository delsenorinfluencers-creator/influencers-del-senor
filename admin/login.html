<!doctype html><html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Iniciar sesión | Jóvenes Influencers del Señor</title><link rel="icon" href="https://i.ibb.co/tw6GTfyV/Dise-o-sin-t-tulo-12.png"><link rel="stylesheet" href="/estilos.css"></head><body><main class="section"><div class="container" style="max-width:520px"><div class="card"><div style="text-align:center"><img data-logo src="" style="width:130px;height:130px;object-fit:contain" alt="Logo"><h1 style="font-size:38px">Iniciar sesión</h1></div><form id="f"><label>Correo electrónico</label><input id="email" type="email" required style="width:100%;padding:14px;border:1px solid var(--borde);border-radius:12px;margin:8px 0 15px"><label>Contraseña</label><input id="pass" type="password" required style="width:100%;padding:14px;border:1px solid var(--borde);border-radius:12px;margin:8px 0 15px"><button class="btn" type="submit">Entrar al panel</button></form><div id="msg" class="notice hidden" style="margin-top:15px"></div></div></div></main><script src="/config.js"></script><script src="/common.js"></script><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script>
const sb=supabase.createClient(window.SUPABASE_URL,window.SUPABASE_PUBLISHABLE_KEY),m=document.getElementById("msg");document.getElementById("f").onsubmit=async e=>{e.preventDefault();m.classList.add("hidden");const r=await sb.auth.signInWithPassword({email:email.value,password:pass.value});if(r.error){m.textContent=r.error.message;m.classList.remove("hidden")}else location.href="/admin/"};</script></body></html>
