<!doctype html><html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Iniciar sesión | Jóvenes Influencers del Señor</title><link rel="icon" href="/favicon.svg"><link rel="stylesheet" href="/estilos.css"></head><body><main class="section"><div class="container" style="max-width:520px"><div class="card"><div style="text-align:center"><img data-logo src="" style="width:130px;height:130px;object-fit:contain" alt="Logo"><h1 style="font-size:38px">Iniciar sesión</h1><p class="lead" style="font-size:16px">Acceso exclusivo al panel administrativo.</p></div><form id="f"><div class="field"><label>Correo electrónico</label><input id="email" type="email" required autocomplete="username"></div><div class="field" style="margin-top:12px"><label>Contraseña</label><input id="pass" type="password" required autocomplete="current-password"></div><button class="btn" type="submit">Entrar al panel</button></form><div id="msg" class="notice hidden" style="margin-top:15px"></div><p style="margin-top:18px"><a href="/">← Volver al sitio</a></p></div></div></main><script src="/config.js"></script><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script src="/common.js"></script><script>
(async()=>{const sb=supabase.createClient(window.SUPABASE_URL,window.SUPABASE_PUBLISHABLE_KEY);const f=document.getElementById('f'),m=document.getElementById('msg');f.onsubmit=async e=>{e.preventDefault();m.classList.add('hidden');const r=await sb.auth.signInWithPassword({email:document.getElementById('email').value.trim(),password:document.getElementById('pass').value});if(r.error){m.textContent=r.error.message;m.classList.remove('hidden');return}const u=r.data.user;const a=await sb.from('admins').select('id').eq('id',u.id).maybeSingle();if(a.error||!a.data){await sb.auth.signOut();m.textContent='El usuario inició sesión, pero todavía no está autorizado como administrador. Agrega su UUID a la tabla admins.';m.classList.remove('hidden');return}location.href='/admin/'};})();
</script></body></html>
